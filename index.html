<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casa Peron</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Casa">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="96x96" href="icon-96.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E5A45">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --sunk:#E3E9E5; --ink:#15302A; --muted:#5B6E66; --line:#D3DDD8;
  --primary:#1E5A45; --on-primary:#FFFFFF; --ochre:#B8730F; --ochre-soft:#F6E7CC; --danger:#B03A32; --ok:#2E7D55;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1814; --surface:#16231E; --sunk:#1D2D27; --ink:#E3EEE8; --muted:#94A89F; --line:#2A3B34;
    --primary:#5DBE95; --on-primary:#0E1814; --ochre:#E6A644; --ochre-soft:#3A2C14; --danger:#E5786F; --ok:#6CCB9A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1814; --surface:#16231E; --sunk:#1D2D27; --ink:#E3EEE8; --muted:#94A89F; --line:#2A3B34;
  --primary:#5DBE95; --on-primary:#0E1814; --ochre:#E6A644; --ochre-soft:#3A2C14; --danger:#E5786F; --ok:#6CCB9A;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
/* il contenuto di <details> in Chrome non eredita box-sizing dal genitore */
details *{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 120px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 16px 10px;max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{font:800 1.05rem/1 var(--display);letter-spacing:-.01em;flex:1}
.month{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.month button{border:0;background:none;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1.1rem;color:var(--muted)}
.sem{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px;flex:none}.sem.green{background:#2E9E62}.sem.yellow{background:#E0A526}.sem.red{background:#D24B3E}.sembar{display:flex;gap:8px;align-items:baseline;margin-top:10px}
.dwrap{display:flex;gap:6px;align-items:stretch}.dwrap .dinp{flex:1;min-width:0}.dpick{position:relative;flex:none;width:44px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--primary);cursor:pointer;overflow:hidden}.dpick svg{width:20px;height:20px}.dpick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0;margin:0}
.month .plab{min-width:118px;text-align:center;font-weight:600;font-size:.92rem;text-transform:capitalize;border:0;background:none;cursor:pointer;padding:0 4px;white-space:nowrap;color:var(--ink)}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.alloc{display:grid;grid-template-columns:12px minmax(0,1fr) auto 3rem;gap:6px 8px;align-items:baseline;margin-top:10px;font-size:.92rem}
.alloc b{font-weight:600;text-align:right}
.alloc small{color:var(--muted);text-align:right}
.alloc .dot{align-self:center}
nav.tabs button{border:0;background:none;padding:10px 4px 9px;cursor:pointer;color:var(--muted);font-size:.78rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--primary)}
nav.sub{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin:2px 0 6px}
nav.sub button{min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 0;font-weight:600;font-size:.76rem;letter-spacing:-.01em;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.sub button[aria-current="page"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.casa-date{color:var(--muted);font-size:.95rem;padding-top:10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;cursor:pointer;width:100%}
.tile svg{width:24px;height:24px;color:var(--primary)}
.tile b{display:block;font:700 1.02rem/1.2 var(--display);margin-top:6px}
.tile span{display:block;color:var(--muted);font-size:.86rem;margin-top:2px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.kvb{width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer;font:inherit;color:inherit}
h2+.kvb{border-top:0}
.kv b{font-weight:600}
.soon{font-size:.78rem;font-weight:600;color:var(--ochre)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:8px}
.ctile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.ctile b{font:700 .98rem/1.2 var(--display);margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctile span{color:var(--muted);font-size:.82rem}
.cface{width:100%;aspect-ratio:1.586;border-radius:10px;object-fit:cover;display:grid;place-items:center;overflow:hidden}
.cface.ini{color:#fff;font:800 1.7rem/1 var(--display);letter-spacing:.02em}
.cface.logo{background:#fff!important;border:1px solid var(--line)}
.cface.logo img{width:46%;height:auto;max-height:70%;object-fit:contain}
.chead{display:flex;gap:12px;align-items:center}
.chead .cface{width:84px;flex:0 0 84px}
.cpanel{background:#fff;color:#111;border-radius:16px;padding:22px 16px 14px;margin:14px 0 6px;text-align:center}
.cpanel svg{max-width:100%;height:auto}
#ccode svg[id="cbar"]{width:100%;height:120px}
#ccode>svg:not([id]){width:min(240px,70vw);height:auto}
.cnum{font:600 1.05rem/1.3 ui-monospace,Menlo,monospace;letter-spacing:.08em;margin-top:10px;word-break:break-all}
.kimg{display:flex;gap:12px;align-items:flex-start}
.cfav{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 .8rem/1 var(--display)}
.cfav.big{width:64px;height:64px;flex:0 0 64px;font-size:1.3rem}
.cfnum{font:600 .86rem/1.2 ui-monospace,Menlo,monospace;letter-spacing:.03em;color:var(--muted)}
.cnum.cfbig{font-size:1.25rem;letter-spacing:.1em;user-select:all;-webkit-user-select:all}
.liadd{display:flex;gap:8px}
.liadd input{flex:1;min-width:0;min-height:44px}
.liadd .btn{padding:10px 14px}
.lirep{font:700 .8rem/1.2 var(--body)!important;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 2px!important}
.lirow{display:flex;align-items:center;border-top:1px solid var(--line)}
.lirep+.lirow,.block>.lirow:first-child{border-top:0}
.lit{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;padding:12px 0;text-align:left;cursor:pointer;font-size:1rem}
.lit span{overflow-wrap:anywhere}
.lbox{flex:0 0 22px;width:22px;height:22px;border:2px solid var(--line);border-radius:7px;display:grid;place-items:center}
.lirow.done .lbox{background:var(--primary);border-color:var(--primary)}
.lirow.done .lbox::after{content:"";width:6px;height:11px;border:solid var(--on-primary);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.lirow.done .lit span{text-decoration:line-through;color:var(--muted)}
.lirep{display:flex;align-items:center;gap:8px}
.lirep svg{width:17px;height:17px}
.liprog{margin:12px 2px 4px}
.liprog>div{display:flex;justify-content:space-between;align-items:center;font-size:.86rem;color:var(--muted);margin-bottom:6px}
.liprog .link{font-size:.86rem}
.liprog>i{display:block;height:7px;border-radius:4px;background:var(--sunk);overflow:hidden}
.liprog>i b{display:block;height:100%;border-radius:4px;background:var(--primary);transition:width .3s ease}
.lbox{transition:background-color .15s ease,border-color .15s ease,transform .15s ease}
.lirow{transition:opacity .22s ease,transform .22s ease}
.lirow.tick .lbox{background:var(--primary);border-color:var(--primary);transform:scale(1.15)}
.lirow.tick{opacity:.35;transform:translateX(14px)}
.lirow.untick{opacity:.35;transform:translateX(-14px)}
.lix{background:none;border:0;color:var(--muted);font-size:1.4rem;line-height:1;width:40px;height:40px;cursor:pointer}
.row.dlrow{grid-template-columns:44px minmax(0,1fr) auto;gap:12px}
.dldate{display:flex;flex-direction:column;align-items:center;justify-content:center;width:44px;height:46px;border-radius:10px;background:var(--sunk);font-size:.72rem;color:var(--muted);text-transform:uppercase;line-height:1.1}
.dldate b{font:800 1.15rem/1 var(--display);color:var(--ink)}
.dldate.soon{background:var(--ochre-soft)}.dldate.soon b{color:var(--ochre)}
.dldate.late{background:var(--danger);color:#fff}.dldate.late b{color:#fff}
.dlt{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlk.soon{color:var(--ochre)}.dlk.late{color:var(--danger)}
.calhead{display:flex;align-items:center;justify-content:space-between;margin:10px 0 6px}
.calhead b{font:700 1.1rem/1.2 var(--display);text-transform:capitalize}
.cgridm{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cwd{text-align:center;font-size:.75rem;font-weight:600;color:var(--muted);padding:2px 0}
.cday{aspect-ratio:1/1.05;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 0 3px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer;font-size:.9rem;font-weight:600;min-width:0}
.cday.today{border-color:var(--primary);color:var(--primary)}
.cday{position:relative;overflow:visible}
.cday.hi{background:color-mix(in srgb,#D4537E 18%,var(--surface))}
.cday.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cdots{display:flex;gap:3px;height:6px}
.hint .dot,.kv .dot{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:0}
.cdots i{width:6px;height:6px;border-radius:50%}
.cday.today{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.cday.today .cdots i{box-shadow:0 0 0 1.5px var(--on-primary)}
.cday.sel{background:var(--surface)!important;color:var(--ink)!important;border-color:var(--ink)!important;box-shadow:0 0 0 1.5px var(--ink) inset}
.cday.today.sel{background:var(--primary)!important;color:var(--on-primary)!important}
.cbar{position:absolute;left:-3px;right:-3px;height:4px;border-radius:0}
.cbar.s{left:5px;border-top-left-radius:3px;border-bottom-left-radius:3px}
.cbar.e{right:5px;border-top-right-radius:3px;border-bottom-right-radius:3px}
.evhi{display:inline-block;font-size:.72rem;font-weight:700;color:#fff;background:#D4537E;border-radius:6px;padding:1px 6px;vertical-align:1px}
.evcheck{display:flex;gap:10px;align-items:flex-start;margin:14px 0;cursor:pointer}
.evcheck input{width:22px;height:22px;margin-top:2px;accent-color:#D4537E}
#kprev{width:110px;flex:0 0 110px}

.banner{margin:4px 0 14px;padding:10px 14px;border-radius:10px;background:var(--ochre-soft);color:var(--ink);font-size:.9rem}

/* Riepilogo */
.hero{padding:18px 2px 6px}
.hero .lbl{color:var(--muted);font-size:.95rem}
.hero .big{font:800 clamp(2.6rem,11vw,3.6rem)/1.02 var(--display);letter-spacing:-.03em;margin:2px 0 6px}
.hero .big small{font-size:.5em;font-weight:700;color:var(--muted);margin-left:2px}
.delta{font-size:.9rem;color:var(--muted)}
.delta b{color:var(--ink)}
.ribbon{display:flex;height:16px;border-radius:5px;overflow:hidden;margin:16px 0 4px;background:var(--sunk);gap:2px}
.ribbon i{display:block;height:100%;min-width:3px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 16px;margin-top:16px}
.block h2{font:700 1.02rem/1.2 var(--display);margin:12px 0 6px}
.row{display:grid;grid-template-columns:12px 1fr auto;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}
.row:first-of-type{border-top:0}
.dot{width:12px;height:12px;border-radius:4px}
.row .bar{grid-column:2/4;height:4px;border-radius:2px;background:var(--sunk);margin-top:-4px;overflow:hidden}
.row .bar i{display:block;height:100%}
.row .amt{font-weight:600}
.row .pct{color:var(--muted);font-weight:500;font-size:.85rem;margin-left:8px}
.cashgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:6px 0 14px}
.cashgrid div{background:var(--sunk);border-radius:10px;padding:10px}
.cashgrid span{display:block;color:var(--muted);font-size:.8rem}
.cashgrid b{font:700 1.1rem/1.3 var(--display)}
.cashgrid .warn{background:var(--ochre-soft)}
.cashgrid .warn b{color:var(--ochre)}
.empty{padding:28px 4px;text-align:left}
.empty h1{font:800 1.9rem/1.1 var(--display);letter-spacing:-.02em;margin:10px 0}
.empty p{color:var(--muted);max-width:52ch}

/* bottoni */
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--primary);color:var(--on-primary)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--danger);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.link{background:none;border:0;color:var(--primary);font-weight:600;cursor:pointer;padding:0}

/* Movimenti */
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 10px}
.filters input{grid-column:1/-1}
input:not([type]),input[type=text],input[type=search],input[type=email],input[type=password],input[type=date],input[type=number],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px;min-height:44px}
textarea{min-height:110px;resize:vertical}
.day{font-size:.82rem;color:var(--muted);font-weight:600;margin:16px 2px 6px;text-transform:capitalize}
.tx{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:6px;cursor:pointer}
.tx .m{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .a{font-weight:700;text-align:right}
.tx .a.in{color:var(--ok)}
.tx .a.mute{color:var(--muted)}
.tx .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.82rem;color:var(--muted);align-items:center}
.tag{display:inline-flex;align-items:center;gap:5px}
.tag .dot{width:9px;height:9px;border-radius:3px}
.flag{background:var(--ochre-soft);color:var(--ochre);border-radius:6px;padding:0 6px;font-weight:600}
.sum{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin:4px 2px}

/* Contanti */
.amount-in{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--line);padding:6px 2px 4px;margin:8px 0 14px}
.amount-in:focus-within{border-color:var(--ochre)}
.amount-in span{font:700 2rem var(--display);color:var(--muted)}
.amount-in input{border:0;background:none;font:800 2.6rem/1.1 var(--display);letter-spacing:-.02em;padding:0;min-height:0;width:100%}
.amount-in input:focus-visible{outline:none}
.seg{display:inline-grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:10px;padding:3px;margin:6px 0 4px}
.seg button{border:0;background:none;padding:8px 16px;border-radius:8px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.field{margin:12px 0}
.field>label,.field>.lab{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.88rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .dot{width:9px;height:9px;border-radius:3px}
.hint{font-size:.84rem;color:var(--muted);margin:6px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Importa */
.drop{display:block;border:2px dashed var(--line);border-radius:14px;padding:24px 16px;text-align:center;cursor:pointer;background:var(--surface);margin:12px 0}
.drop b{font:700 1.1rem var(--display);display:block;margin-bottom:4px}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop.over{border-color:var(--ochre)}
.map{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.map label{font-size:.82rem;font-weight:600;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.stats span{background:var(--sunk);border-radius:8px;padding:4px 10px;font-size:.86rem}
.prow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.prow.dup{opacity:.55}
.prow .top{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline}
.prow .d{color:var(--muted);font-size:.82rem}
.prow .m{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .x{font-size:.78rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:2px 0 6px}
.prow .ctrl{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-items:center}
.prow .ctrl .full{grid-column:1/-1}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin:8px 0}
.seg.sm button{padding:6px 12px;font-size:.86rem}
.prow select{min-height:38px;padding:6px 8px;font-size:15px}
.prow .by{font-size:.75rem;color:var(--muted);margin-top:4px}
.prow .by.low{color:var(--ochre);font-weight:600}

function monthState(ym){

function semDot(ym){const st=monthState(ym).st;return st?`<i class="sem ${st}" title="${st==="green"?"Mese chiuso: tutto importato e i saldi tornano":st==="red"?"Un saldo della banca non torna":"Mese non ancora chiuso"}"></i>`:""}
function semBanner(){if(S.per.from!==S.per.to)return "";const ym=S.per.from,M=monthState(ym);if(M.st!=="yellow"&&M.st!=="red")return "";

// Addebito della carta di credito sul conto: deve corrispondere al dettaglio dell'estratto carta
function dayDiff(a,b){return Math.abs(Date.parse(a)-Date.parse(b))/86400000}
// Ciclo dell'estratto carta: chiude "cut" giorni prima della fine del mese; l'addebito arriva sul conto il mese dopo
const RE_CARDCHG = /(cart[ae]\s(di\s)?credito|carta credito|saldo carta|estratto conto carta|e\/c carta|addebito e\/c|nexi|cartasi|american express|amex|flexia)/i;
function lastDay(ym){const [y,m]=ym.split("-").map(Number);return new Date(Date.UTC(y,m,0)).getUTCDate()}
function cycleEnd(ym,cut){return ym+"-"+String(lastDay(ym)-cut).padStart(2,"0")}
function nextDay(d){return new Date(Date.parse(d)+86400000).toISOString().slice(0,10)}
function cardTx(){return S.all.filter(t=>t.s===FLOWS.carta&&(t.k==="spesa"||t.k==="prelievo"))}
// E = mese dell'estratto carta ("ESTRATTO 08/2026" nell'addebito UniCredit), altrimenti il mese prima dell'addebito
function stmtOf(t){const m=norm((t.x||"")+" "+(t.m||"")).match(/estratto\s+(?:conto\s+)?(\d{1,2})[\/.\-](\d{4})/);if(m&&+m[1]>=1&&+m[1]<=12) return m[2]+"-"+String(+m[1]).padStart(2,"0");return shiftYM(ymOf(t.d),-1)}
function cardLast4(t){const m=String(t.x||"").toUpperCase().match(/(?:\*{2,}|X{3,}|•{2,})\s?(\d{4})\b/);return m?m[1]:null}
function cardContoOf(l4){const id=l4&&(S.settings.acctok||{})["carta "+l4];return id&&conti()[id]&&conti()[id].t==="carta"?id:null}
function cardRange(E,cut){return [cycleEnd(shiftYM(E,-1),cut),cycleEnd(E,cut)]}
function cardSpent(E,cut,acc){const [from,to]=cardRange(E,cut);return -sum(cardTx().filter(t=>t.d>from&&t.d<=to&&(!acc||t.acc===acc)))}
function ccOut(ym){return S.all.filter(t=>t.s===FLOWS.cc&&t.a<0&&(t.k==="giroconto"||t.k==="spesa")&&(!ym||ymOf(t.d)===ym))}
function isCardText(t){return RE_CARDCHG.test(norm((t.x||"")+" "+(t.m||"")))}
// Stima di quanti giorni prima di fine mese chiude l'estratto (0-5), dai mesi con un addebito carta riconoscibile
function cardCut(){
  const key=S.ver;if(cardCut.k===key) return cardCut.v;
  const byM={};for(const t of ccOut()) if(isCardText(t)) byM[stmtOf(t)]=(byM[stmtOf(t)]||0)-t.a;
  const ms=Object.keys(byM);let best=2,err=Infinity;
  if(ms.length&&cardTx().length) for(const c of [2,0,1,3,4,5]){const e=ms.reduce((s2,ym)=>s2+Math.abs(byM[ym]-cardSpent(ym,c)),0);if(e<err-0.5){err=e;best=c}}
  cardCut.k=key;cardCut.v=best;return best;
}
// Addebiti carta di un mese: per descrizione, oppure giroconto/spesa con lo stesso importo delle spese carta del ciclo
function cardCharges(ym){const sp=cardSpent(shiftYM(ym,-1),cardCut());return ccOut(ym).filter(t=>isCardText(t)||(sp>1&&Math.abs(-t.a-sp)<=1))}
function cardCharge(d,a){
  const amt=Math.abs(a);
  for(const t of S.all) if(t.s===FLOWS.carta&&t.k==="giroconto"&&Math.abs(Math.abs(t.a)-amt)<0.01&&dayDiff(t.d,d)<=45) return "stesso importo del pagamento saldo nell’estratto carta";
  const E=shiftYM(ymOf(d),-1),net=cardSpent(E,cardCut()),[from,to]=cardRange(E,cardCut());
  if(net>1&&Math.abs(net-amt)<=1) return "pari alle spese con la carta dal "+ddmm(nextDay(from))+" al "+ddmm(to);
  return null;
}
// Conti vostri che non importate (Revolut, conti a vostro nome): i bonifici verso/da questi sono giroconti
function ownNames(extra){
  const out=new Set();
  for(const hn of [...contoList().map(([,v])=>v.holder),extra]) if(hn){const w=norm(hn).split(" ").filter(Boolean);if(w.length>=2){out.add(w.join(" "));out.add([...w.slice(1),w[0]].join(" "))}}
  for(const n of (S.settings.own||[])) if(String(n).trim()) out.add(norm(n));
  return [...out].filter(n=>n.length>=4);
}
function ownName(desc,extra){
  const t=" "+norm(desc).replace(/[^a-z0-9]+/g," ")+" ";
  if(/ (sdd|mandato|addebito diretto) /.test(t)) return null;

  return null;
}
// Bonifico tra i vostri conti: stesso importo uscito da un conto ed entrato in un altro entro 6 giorni
function ownTransfer(d,a,acc,flow){
  if(flow==="carta") return null;
  for(const t of S.all){
    if(t.s===FLOWS.carta||t.s===CASH||t.k==="prelievo") continue;

    if(acc?t.acc===acc:(!t.acc&&t.s===FLOWS[flow])) continue;
    if(Math.abs(t.a+a)<0.01&&dayDiff(t.d,d)<=6) return (a<0?"entrato lo stesso importo su ":"uscito lo stesso importo da ")+srcName(t)+" il "+ddmm(t.d);
  }
  return null;
}

function mkey(m){return norm(m).replace(/[^a-z0-9 &]/g," ").split(" ").filter(w=>w.length>1).slice(0,2).join(" ")}
const MERCH_RE = [
  /ESERCENTE\s*:\s*(.+?)(?:\s+IMP\.?\s*IN\b|\s+N\.\s*CARTA|$)/,          // Widiba carta
  /\bSDD DA \S+\s+(.+?)\s+(?:MANDATO|$)/,                                    // UniCredit domiciliazione
  /\bA FAVORE\s+(?:DI\s+)?(.+?)\s+(?:CODICE MANDATO|IBAN|$)/,                // Widiba bonifico / SDD

// Toglie codici di causale e diciture fisse a zero ("COMM: 0,00 SPESE: 0,00", "Commissioni 0,00")
function cleanDesc(v){return String(v??"").replace(/\s+/g," ").replace(/\b(comm(issioni)?( serv)?|spese)\s*:?\s*0,00\b/gi," ").replace(/\bTRN:\s*\S+/gi," ").replace(/\s+/g," ").trim()}
function extractMerchant(desc){
  let s=" "+String(desc||"").toUpperCase().replace(/\s+/g," ")+" ";
  for(const re of MERCH_RE){const m=s.match(re);if(m&&m[1].trim()){s=m[1];break}}
  s=s.replace(/\*+\s*\d+/g," ")
     .replace(/\b\d{1,2}[\/.\-]\d{1,2}([\/.\-]\d{2,4})?\b/g," ")
     .replace(/\b\d{1,2}[:.]\d{2}\b/g," ")
     .replace(/\b\d+[.,]\d{2}\b/g," ")
     .replace(/\b\d{4,}\b/g," ")
     .replace(/\b(PAGAMENTO|PAGAM|PAG|POS|CARTA|CARD|NFC|CONTACTLESS|APPLE PAY|GOOGLE PAY|OPERAZIONE|OPERAZ|ACQUISTO|DEL|ALLE|ORE|EUR|EURO|NR|N|DATA|VALUTA|DEBIT|DEBITO|CREDITO|MASTERCARD|VISA|MAESTRO|BANCOMAT|PAGOBANCOMAT|ADDEBITO|SDD|DISPOSIZIONE|ITA|IT|ITALY|ITALIA|DI|CON)\b\.?/g," ")
     .replace(/[^A-Z0-9À-Ü&'.\- ]/g," ").replace(/\s+/g," ").trim();
  const out=s.split(" ").slice(0,5).join(" ");
  return out?titleCase(out):String(desc||"").slice(0,40);
}
function detectKind(desc,a,flow){
  const t=norm(desc);
  if(flow!=="carta"&&isVincolo(t)) return "giroconto";
  if(flow==="ris"){
    if(a<0&&/(bollo|imposta|ritenut|commission|canone|spese)/.test(t)) return "spesa";
    if(a>0&&/(interess|cedol|premio|rendiment)/.test(t)) return "entrata";
    return "giroconto";
  }
  if(flow==="carta"){
    if(RE_SALDO.test(t)||RE_GIRO.test(t)) return "giroconto";
    if(a<0&&RE_PREL.test(" "+t)) return "prelievo";
    return "spesa";
  }
  if(RE_GIRO.test(t)) return "giroconto";
  if(a>0&&RE_STORNO.test(t)) return "spesa";
  if(a<0 && RE_PREL.test(" "+t)) return "prelievo";
  if(a>0) return "entrata";
  return "spesa";
}

function rebuild(){
  const out=[];
  for(const [,d] of Object.entries(S.months)){
    const tx=(d&&d.tx)||{};
    for(const [id,t] of Object.entries(tx)) if(t&&t.d) out.push({...t,id});
  }
  out.sort((a,b)=>b.d.localeCompare(a.d)||(b.t||0)-(a.t||0));
  // un prelievo segnato a mano lascia il posto a quello uguale arrivato con l'estratto (stesso importo, chi preleva, da 3 giorni prima a 7 dopo)
  const bankPrel=out.filter(t=>t.k==="prelievo"&&t.acc),usedP=new Set(),dupP=new Set();
  for(const t of out){if(t.k!=="prelievo"||t.acc||t.cb!=="manuale")continue;const lo=shiftDay(t.d,-3),hi=shiftDay(t.d,7);
    const m=bankPrel.find(o=>!usedP.has(o.id)&&Math.abs(o.a-t.a)<0.01&&o.d>=lo&&o.d<=hi&&(!t.pb||!o.pb||o.pb===t.pb));if(m){usedP.add(m.id);dupP.add(t.id)}}
  if(dupP.size){const keep=out.filter(t=>!dupP.has(t.id));out.length=0;out.push(...keep)}
  S.ver=(S.ver||0)+1;
  S.all=out; S.byId=Object.fromEntries(out.map(t=>[t.id,t]));
}

// ---------- Impronta e correzioni ----------
// Impronta di un movimento importato: conto + data + importo + ordine tra i movimenti uguali dello stesso giorno.
// Non dipende dalla pulizia della descrizione né da chi paga: resta uguale anche quando migliora il riconoscimento.
// importo senza segno: se correggete il segno (spesa/rimborso) il movimento resta riconoscibile
function fpKey(acc,d,a,n){return "k"+d.replace(/-/g,"")+"_"+hash(acc+"|"+Math.round(Math.abs(a)*100)+"|"+n)}
function keyYm(k){return k.slice(1,5)+"-"+k.slice(5,7)}
// Impronte dei movimenti già salvati; quelli importati con le versioni precedenti hanno un id diverso e la si calcola qui
function keyMap(){
  if(keyMap.v===S.ver) return keyMap.m;
  const m={},byId={},groups={};
  for(const t of S.all){if(!t.acc)continue;if(/^k\d{8}_/.test(t.id)){m[t.id]=t;byId[t.id]=t.id;continue}const g=t.acc+"|"+t.d+"|"+Math.round(Math.abs(t.a)*100);(groups[g]=groups[g]||[]).push(t)}
  for(const list of Object.values(groups)){list.sort((x,y)=>norm(x.x).localeCompare(norm(y.x))||(x.t||0)-(y.t||0));list.forEach((t,n)=>{const k=fpKey(t.acc,t.d,t.a,n);m[k]=t;byId[t.id]=k})}
  keyMap.v=S.ver;keyMap.m=m;keyMap.byId=byId;return m;
}
function keyOf(t){if(!t||!t.acc)return null;if(/^k\d{8}_/.test(t.id))return t.id;keyMap();return keyMap.byId[t.id]||null}

// Quello che si salva di un movimento corretto a mano: tipo, segno, categoria, persone, nome, nota
function fixFields(t,cb){
  const f={k:t.k,a:t.a,p:t.p,pb:t.pb,m:t.m,n:t.n,ty:t.ty,rif:t.rif,nr:t.nr,cb};
  if(t.k==="spesa")f.c=t.c||"altro";

function applyFix(tx,fx){
  if(fx.k){tx.k=fx.k;if(fx.k!=="spesa")tx.c=null;else if(!tx.c)tx.c="altro"}
  if(fx.c&&tx.k==="spesa")tx.c=fx.c;
  for(const n of ["p","pb","m","n","ty","rif","nr"]) if(fx[n])tx[n]=fx[n];
  if(fx.a&&Math.abs(Math.abs(fx.a)-Math.abs(tx.a))<0.005)tx.a=fx.a;
  tx.cb=fx.cb||"manuale";tx.f=fx.fc??null;tx.gw=null;tx.fixed=true;
}

// ---------- Lettura file banca ----------
function detectDelim(text){
  const lines=text.split(/\r?\n/).slice(0,25);let best=";",score=-1;
  for(const d of [";",",","\t","|"]){const c=lines.reduce((t,l)=>t+(l.split(d).length-1),0);if(c>score){score=c;best=d}}
  return best;
}
function parseCSV(text,d){
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch==='"') q=true;
    else if(ch===d){row.push(cell);cell=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(cell);rows.push(row);row=[];cell=""}
    else cell+=ch;
  }
  if(cell!==""||row.length){row.push(cell);rows.push(row)}
  return rows;
}
async function readGrids(file){
  const buf=await file.arrayBuffer();const name=file.name.toLowerCase();
  const isText=/\.(csv|txt|tsv)$/.test(name);
  if(!isText){
    if(!window.XLSX) throw new Error("La lettura dei file Excel non è disponibile ora: esporta in CSV oppure ricarica la pagina.");
    const wb=XLSX.read(buf,{type:"array"});
    return wb.SheetNames.map(n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:""}));
  }
  let text;
  try{text=new TextDecoder("utf-8",{fatal:true}).decode(buf)}catch(e){text=new TextDecoder("windows-1252").decode(buf)}
  text=text.replace(/^\uFEFF/,"");
  return [parseCSV(text,detectDelim(text))];
}
const COLRE = {
  d:/^(data( (contabile|cont\.?|operazione|registrazione|movimento|acquisto|transazione|op\.?))?|date|giorno|data op\.?)$/,
  dv:/data valuta|data val\.?$|valuta/,
  x:/descrizion|causale|dettagli|operazione|esercente|beneficiario|controparte|motivo|description|merchant|note|informazioni|^movimento$|parola chiave|osservazion|concetto/,
  xt:/^(parola chiave|tipo|tipo operazione|tipologia)$/,
  bal:/^(disponibile|saldo|saldo contabile|saldo disponibile|saldo \(eur\))$/,
  a:/^(importo|importi|amount|ammontare|valore|importo (in )?eur|importo euro|importo \(eur\)|importo €)$|^importo/,
  deb:/^(dare|uscit|addebit|debit|addebiti|movimenti dare|importo dare)/,
  cre:/^(avere|entrat|accredit|credit|accrediti|movimenti avere|importo avere)/
};
function findHeader(grid){
  for(let r=0;r<Math.min(grid.length,40);r++){
    const cells=(grid[r]||[]).map(c=>norm(c));
    const has=re=>cells.findIndex(c=>c&&re.test(c));
    let d=has(COLRE.d); if(d<0) d=has(COLRE.dv);

function num(v){

  if(!s) return NaN;
  if(s.includes(",")&&s.includes(".")){ s = s.lastIndexOf(",")>s.lastIndexOf(".") ? s.replace(/\./g,"").replace(",",".") : s.replace(/,/g,"") }
  else if(s.includes(",")) s=s.replace(/\./g,"").replace(",",".");

function toISO(v){

  const s=String(v??"").trim();
  let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){let y=+m[3];if(y<100)y+=2000;const mo=+m[2],d=+m[1];if(mo<1||mo>12||d<1||d>new Date(Date.UTC(y,mo,0)).getUTCDate())return null;return y+"-"+String(mo).padStart(2,"0")+"-"+String(d).padStart(2,"0")}

function idTokens(grid,hdr){

    for(const m of u.replace(/\s+/g,"").matchAll(/IT\d{2}[A-Z]\d{10}[0-9A-Z]{12}/g)){const k="iban "+m[0].slice(-8);if(pre)out.add(k);else cnt[k]=(cnt[k]||0)+1}

  for(let r=0;r<rows;r++){const pre=r<hdr;for(const c of (grid[r]||[])) scan(c,pre)}

    }

// Saldi riportati dalla banca: in testata ("Saldo Contabile: 4.450,29 EUR A Credito") o colonna riga per riga ("Disponibile")
function bankBal(I){
  const out=[],g=I.grid,mp=I.map,bi=mp.bal!=null&&mp.bal>=0?mp.bal:-1;
  const rows=[];for(let r=I.hdr+1;r<g.length;r++){const row=g[r]||[];const d=toISO(row[mp.d]);if(d)rows.push({d,b:bi>=0?num(row[bi]):NaN})}
  if(!rows.length) return out;
  const ds=rows.map(x=>x.d),min=ds.reduce((a,b)=>a<b?a:b),max=ds.reduce((a,b)=>a>b?a:b);
  for(const l of I.pre||[]){const m=l.match(/saldo contabile:\s*(-?[\d.,]+)\s*eur\w*(?:\s*a\s*(credito|debito))?/i);if(m){const v=num(m[1]);if(!isNaN(v))out.push({d:max,v:/debito/i.test(m[2]||"")?-Math.abs(v):v});break}}
  if(bi>=0){
    const desc=rows[0].d>=rows[rows.length-1].d,endOf=d=>{const list=rows.filter(x=>x.d===d&&!isNaN(x.b));return list.length?(desc?list[0]:list[list.length-1]).b:NaN};
    for(const d of [min,max]){const v=endOf(d);if(!isNaN(v)&&!out.some(o=>o.d===d))out.push({d,v:Math.round(v*100)/100})}
  }
  return out;
}
function buildRows(){
  const I=S.imp,g=I.grid,mp=I.map,out=[],seen={},raws=[];
  if(mp.d<0||(mp.a<0&&mp.deb<0&&mp.cre<0)){I.rows=[];return}
  // le altre colonne con una data (data registrazione / operazione / valuta): servono a riconoscere i movimenti già salvati con l'altra data
  const hcells=(g[I.hdr]||[]).map(c=>norm(c));I.altCols=hcells.map((c,i)=>c&&i!==mp.d&&(COLRE.d.test(c)||COLRE.dv.test(c))?i:-1).filter(i=>i>=0);
  // primo passaggio: data, importo e testo originale, per numerare i movimenti uguali dello stesso giorno
  for(let r=I.hdr+1;r<g.length;r++){
    const row=g[r]||[];const d=toISO(row[mp.d]);if(!d) continue;
    let a;

    else{const de=mp.deb>=0?num(row[mp.deb]):NaN,cr=mp.cre>=0?num(row[mp.cre]):NaN;a=(isNaN(de)&&isNaN(cr))?NaN:(isNaN(cr)?0:Math.abs(cr))-(isNaN(de)?0:Math.abs(de))}
    if(isNaN(a)||a===0) continue;
    if(I.invert&&mp.a>=0) a=-a;
    a=Math.round(a*100)/100;
    raws.push({r,d,a,alts:I.altCols.map(i=>toISO(row[i])).filter(x=>x&&x!==d),raw:norm([mp.x1,mp.x2,mp.x3].filter(i=>i!=null&&i>=0).map(i=>String(row[i]??"")).join(" "))});
  }
  const grp={};for(const x of raws){const k=x.d+"|"+Math.round(Math.abs(x.a)*100);(grp[k]=grp[k]||[]).push(x)}
  for(const list of Object.values(grp)){list.sort((x,y)=>x.raw.localeCompare(y.raw)||x.r-y.r);list.forEach((x,n)=>{x.key=fpKey(I.acc||"",x.d,x.a,n)})}
  const known=keyMap();I.gone=0;
  for(const x of raws){const r=x.r;
    const row=g[r]||[];const d=x.d;
    // più colonne di descrizione: tolgo i doppioni (BBVA ripete "Movimento" in "Osservazioni")
    const parts=[];
    for(const i of [mp.x1,mp.x2,mp.x3]){if(i==null||i<0)continue;const v=cleanDesc(row[i]);if(!v||/^\d{1,4}$/.test(v))continue;const nv=norm(v);
      if(parts.some(q=>norm(q.v).includes(nv)))continue;for(let j=parts.length-1;j>=0;j--)if(nv.includes(norm(parts[j].v)))parts.splice(j,1);parts.push({i,v})}
    const desc=parts.map(q=>q.v).join(" · ");
    // il nome dell'esercente non viene dalla colonna del tipo di operazione ("Bonifico eseguito"), se c'è altro
    const named=parts.filter(q=>!COLRE.xt.test(norm(I.cols[q.i]||"")));
    const mdesc=(named.length?named:parts).map(q=>q.v).join(" ");
    const a=x.a,id=x.key,rk=id;
    let k=detectKind(desc,a,I.flow),gw=null;
    if(I.flow==="cc"&&k==="spesa"&&a<0){const w=cardCharge(d,a);if(w){k="giroconto";gw="Addebito carta: "+w}}
    if(!gw&&I.flow!=="carta"&&(k==="spesa"||k==="entrata")){const w=ownTransfer(d,a,I.acc,I.flow);if(w){k="giroconto";gw="Trasferimento tra i vostri conti: "+w}}
    if(k==="entrata"&&RE_GENIUS.test(norm(desc))){k="spesa";gw="Rimborso del canone My Genius"}
    if(!gw&&I.flow!=="carta"&&(k==="spesa"||k==="entrata")){const w=ownName(extractMerchant(mdesc),I.holder);if(w){k="giroconto";gw="Bonifico con un vostro conto: "+titleCase(w)}}
    const tx={id,rk,d,a,x:desc,m:extractMerchant(mdesc),k,s:FLOWS[I.flow],acc:I.acc||undefined,p:I.person,pb:I.payer,c:k==="spesa"?"":null,cb:null,f:null,gw};
    if(k==="spesa"){const ac=autoCat(tx);if(ac){tx.c=ac.c;if(ac.p)tx.p=ac.p;tx.cb=ac.by}}
    if(gw==="Rimborso del canone My Genius"){tx.c="banca";tx.cb="regola";const e=geniusRef(tx,S.all);if(e)tx.rif=[keyOf(e)||e.id]}
    // correzioni salvate da un import o da una modifica precedente
    const fx=fixFor(id);

  if(I.acc&&I.altCols.length){const ex={},claimed=new Set(out.filter(r=>r.dup).map(r=>r.id));
    for(const t of S.all)if(t.acc===I.acc){const k=Math.round(t.a*100)+"|"+t.d;(ex[k]=ex[k]||[]).push(t)}

    for(const r of out){if(r.dup)continue;for(const ad of altOf[r.id]||[]){const l=(ex[Math.round(r.a*100)+"|"+ad]||[]).filter(t=>!claimed.has(t.id));if(l.length){claimed.add(l[0].id);r.dup=true;r.altdup={d:ad,m:l[0].m};break}}}}
  if(I.acc&&out.length){const keep=I.keep||(I.keep={}),ds=out.map(r=>r.d).sort(),dmin=ds[0],dmax=ds[ds.length-1],fk=new Set(out.map(r=>r.id)),used=new Set();
    const cand=S.all.filter(t=>t.acc===I.acc&&t.d>=dmin&&t.d<=dmax&&!fk.has(t.id)&&!fk.has(keyOf(t)));
    for(const r of out){if(r.dup||keep[r.rk])continue;let best=null,bd=99;
      for(const c of cand){if(used.has(c.id)||Math.abs(c.a-r.a)>0.004)continue;const dd=Math.abs(Date.parse(c.d)-Date.parse(r.d))/864e5;if(dd<=5&&dd<bd){bd=dd;best=c}}
      if(best){used.add(best.id);r.dup=true;r.pdup={d:best.d,m:best.m}}}}
  out.sort(I.sort==="data"?(x,y)=>y.d.localeCompare(x.d):I.sort==="nome"?(x,y)=>String(x.m).localeCompare(String(y.m),"it")||y.d.localeCompare(x.d):(x,y)=>((x.k==="spesa"?0:1)-(y.k==="spesa"?0:1))||Math.abs(y.a)-Math.abs(x.a)||y.d.localeCompare(x.d));

async function callClaude(prompt){
  let messages=[{role:"user",content:prompt}];
  for(let turn=0;turn<5;turn++){
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
      headers:{"content-type":"application/json","x-api-key":apiKey(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:apiModel(),max_tokens:4096,messages,
        tools:[{type:"web_search_20250305",name:"web_search",max_uses:12,user_location:{type:"approximate",city:"Treviso",region:"Veneto",country:"IT",timezone:"Europe/Rome"}}]})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){const err=new Error((j.error&&j.error.message)||("HTTP "+r.status));err.status=r.status;throw err}
    const ws=j.usage&&j.usage.server_tool_use&&j.usage.server_tool_use.web_search_requests;
    if(S.imp&&ws) S.imp.searches=(S.imp.searches||0)+ws;
    if(j.stop_reason==="pause_turn"){messages=[...messages,{role:"assistant",content:j.content}];continue}
    const blocks=j.content||[];
    let last=-1;blocks.forEach((b,i)=>{if(b.type==="web_search_tool_result")last=i});
    return blocks.slice(last+1).filter(b=>b.type==="text").map(b=>b.text).join("");
  }
  throw new Error("Risposta incompleta");
}

function dupPairs(){
  const key=S.ver+"|"+(S.setVer||0);if(S._dp&&S._dp.k===key)return S._dp.l;
  const nd=S.settings.notDup||{},vis=new Set(visConti().map(([k])=>k)),by={},out=[],used=new Set();
  for(const t of S.all){if(!t.acc||!vis.has(t.acc)||!t.t||t.cb==="manuale")continue;const k=t.acc+"|"+Math.round(Math.abs(t.a)*100)+"|"+(t.a<0?"-":"+");(by[k]=by[k]||[]).push(t)}
  for(const l of Object.values(by)){if(l.length<2)continue;l.sort((a,b)=>a.d.localeCompare(b.d));
    for(let i=0;i<l.length;i++)for(let j=i+1;j<l.length;j++){const a=l[i],b=l[j];if((Date.parse(b.d)-Date.parse(a.d))/864e5>5)break;

      used.add(a.id);used.add(b.id);out.push((a.t||0)>(b.t||0)?[b,a]:[a,b])}}

async function liveScan(){
  if(S.scan)return;
  const ov=document.createElement("div");ov.className="scanov";
  ov.innerHTML=`<video playsinline muted autoplay></video><div class="scanframe"><i></i></div><p class="scanmsg">Inquadra il codice a barre o il QR</p><div class="scanbtns"><button class="btn ghost" data-act="scan-photo">Da una foto</button><button class="btn" data-act="scan-close">Annulla</button></div>`;
  document.body.appendChild(ov);S.scan={ov};
  const video=ov.querySelector("video"),fail=msg=>{if(!S.scan)return;ov.querySelector(".scanmsg").textContent=msg;ov.classList.add("err")};
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){fail("Fotocamera non disponibile qui: usa «Da una foto».");return}
  try{
    let det=null;if(window.BarcodeDetector){try{det=new BarcodeDetector()}catch(_){det=null}}
    // senza lettore integrato (iPhone) si usa ZXing sui fotogrammi del video
    let zx=null;
    if(!det){if(!window.ZXing) await loadScript("https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js");
      const hints=new Map();hints.set(ZXing.DecodeHintType.TRY_HARDER,true);zx=new ZXing.MultiFormatReader();zx.setHints(hints)}
    if(!S.scan)return;
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false});
    if(!S.scan){stream.getTracks().forEach(t=>t.stop());return}
    S.scan.stream=stream;video.srcObject=stream;await video.play().catch(()=>{});
    const cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});
    const tick=async()=>{
      if(!S.scan)return;
      try{
        if(video.readyState>=2&&video.videoWidth){
          if(det){const r=await det.detect(video);if(r&&r[0]&&r[0].rawValue){scanDone({num:r[0].rawValue,f:BD_FMT[r[0].format]||""});return}}
          else{
            const sc=Math.min(1,960/video.videoWidth);cv.width=Math.round(video.videoWidth*sc);cv.height=Math.round(video.videoHeight*sc);cx.drawImage(video,0,0,cv.width,cv.height);
            try{const res=zx.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(cv))));if(res){scanDone({num:res.getText(),f:ZX_FMT[ZXing.BarcodeFormat[res.getBarcodeFormat()]]||""});return}}catch(_){}
          }
        }
      }catch(_){}
      if(S.scan)S.scan.t=setTimeout(tick,det?150:220);
    };tick();
  }catch(e){fail(e&&e.name==="NotAllowedError"?"Permesso fotocamera negato: abilitalo nelle impostazioni del telefono, oppure usa «Da una foto».":"Non riesco ad aprire la fotocamera: usa «Da una foto».")}
}

function addMonthsISO(iso,n){const [y,m,d]=iso.split("-").map(Number);const t=new Date(Date.UTC(y,m-1+n,1));const ym=t.toISOString().slice(0,7);return ym+"-"+String(Math.min(d,lastDay(ym))).padStart(2,"0")}
function nextDate(x){if(!x.rep)return null;const n=+x.rep.slice(1)*(x.rep[0]==="y"?12:1);return addMonthsISO(x.d,n)}
function daysTo(iso){return Math.round((Date.parse(iso)-Date.parse(today()))/86400000)}
// tutte le date in cui cade una scadenza entro "to" (per i totali dei prossimi mesi)
function occurrences(x,to){const out=[];let d=x.d,i=0;while(d&&d<=to&&i<60){out.push(d);if(!x.rep)break;d=addMonthsISO(x.d,(++i)*(+x.rep.slice(1))*(x.rep[0]==="y"?12:1))}return out}
// pagamento probabile: spesa entro 20 giorni dalla scadenza, stesso importo (±5%) e, se indicata, la parola nella descrizione
function dlMatch(x){
  if(!x.a||x.done) return null;const kw=norm(x.kw||"").trim(),from=shiftDay(x.d,-20),to=shiftDay(x.d,20),used=new Set((x.paid||[]).map(p=>p.tx));
  let best=null;
  for(const t of S.all){
    if(t.d<from||t.d>to||t.a>=0||t.k==="giroconto"||used.has(t.id)) continue;
    if(Math.abs(Math.abs(t.a)-x.a)>Math.max(1,x.a*.05)) continue;
    if(kw&&!norm((t.x||"")+" "+(t.m||"")).includes(kw)) continue;
    const sc=dayDiff(t.d,x.d)+Math.abs(Math.abs(t.a)-x.a);if(!best||sc<best.sc)best={t,sc};
  }
  return best&&best.t;

function dlRow(x){

  return `<button class="row dlrow" data-act="dl-open" data-id="${h(x.id)}">
    <span class="dldate${late?" late":soon?" soon":""}"><b>${x.d.slice(8,10)}</b>${new Date(x.d+"T12:00:00").toLocaleDateString("it-IT",{month:"short"})}</span>
    <span style="min-width:0"><span class="dlt">${h(x.t)}</span><span class="hint" style="display:block;margin:0">${[x.pb,REP[x.rep||""]!=="Una volta"?REP[x.rep].toLowerCase():"",when].filter(Boolean).map(h).join(" · ")}</span>

function vDeadlines(){

    <p class="hint" style="margin:14px 2px">Le scadenze che si ripetono, quando le segni come fatte, passano da sole alla data successiva. I totali contano anche le ripetizioni.</p>`;

// .ics: evento di un giorno con promemoria e ripetizione; il telefono lo apre nel suo calendario
function icsText(x){

  return `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Casa//Scadenze//IT\r\nBEGIN:VEVENT\r\nUID:${x.id}@casa\r\nDTSTAMP:${new Date().toISOString().replace(/[-:]/g,"").slice(0,15)}Z\r\nDTSTART;VALUE=DATE:${d}\r\nDTEND;VALUE=DATE:${e}\r\n${rr}SUMMARY:${esc(x.t)}\r\n${desc?"DESCRIPTION:"+esc(desc)+"\r\n":""}BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:${esc(x.t)}\r\nTRIGGER:-P${x.pre??7}DT0H\r\nEND:VALARM\r\nEND:VEVENT\r\nEND:VCALENDAR\r\n`;
}

// ---------- Calendario: griglia del mese con scadenze ed eventi di famiglia (compleanni, feste, visite…) ----------
const EV_COL="#7F77DD",EV_HI="#D4537E",DL_COL="#E6A644";

function evs(){const seen=new Set();return Object.entries(S.evs||{}).map(([id,x])=>({id,...x})).sort((a,b)=>a.id.localeCompare(b.id)).filter(e=>{const k=[norm(e.t),e.d,e.d2||"",e.time||"",e.rep||""].join("|");if(seen.has(k))return false;seen.add(k);return true})}

const EV_REP={"":"Una volta",w1:"Ogni settimana",w2:"Ogni 2 settimane",m1:"Ogni mese",y1:"Ogni anno"};
function evStep(e,i){const n=+(e.rep||"x1").slice(1)||1;return e.rep[0]==="w"?shiftDay(e.d,7*n*i):addMonthsISO(e.d,(e.rep[0]==="y"?12:1)*n*i)}

function evOcc(e,from,to){
  const len=e.d2&&e.d2>e.d?spanDays(e.d,e.d2):0,out=[];
  if(!e.rep){const end=shiftDay(e.d,len);if(e.d<=to&&end>=from)out.push(e.d);return out}
  // si parte poco prima di "from" per non scorrere tutte le ripetizioni dall'inizio
  const n=+e.rep.slice(1)||1,per=e.rep[0]==="w"?7*n:(e.rep[0]==="y"?365*n:30*n);
  let i=Math.max(0,Math.floor((spanDays(e.d,from)-len)/per)-2);

// tutto quello che cade in un giorno: eventi (anche su più giorni), scadenze aperte e loro ripetizioni, scadenze già pagate
function dayItems(iso){

  for(const x of dls()){

// a quale voce del budget va un movimento e con quale importo (positivo = entrata per le entrate, uscita per il resto)
function budKey(t,C){
  // contanti (nel budget personale di chi li usa): la spesa va nella sua categoria; il prelievo segnato a mano conta finché non arriva quello della banca
  if(!t.acc){if(C.fam||t.pb!==C.sc)return null;if(t.s===CASH&&t.k==="spesa")return ["cat:"+(t.c||"altro"),-t.a];if(t.k==="prelievo"&&t.cb==="manuale")return ["extra:contanti",-t.a];return null}
  if(!C.accs.has(t.acc))return null;
  if(t.k==="prelievo")return ["extra:contanti",-t.a];
  if(t.k==="giroconto"){
    if(isCardText(t))return null;
    if(isVincolo(norm((t.x||"")+" "+(t.m||""))))return ["sav",-t.a];
    const c=counterpart(t)||pCounter(t,C.patr);
    if(c&&C.patr.has(c.acc))return ["sav",-t.a];
    if(!c&&ownName(t.m||""))return ["sav",-t.a];
    const ca=c&&conti()[c.acc];if(!ca)return null;
    if(C.fam)return payers().includes(ca.pb)?["in:vers:"+ca.pb,t.a]:null;
    if(ca.pb===JOINT&&ruolo(c.acc)==="corrente")return ["casa",-t.a];
    return null;
  }
  if(t.k==="entrata"){
    if(isPatr(t))return null;
    // un rimborso abbinato riduce la spesa a cui si riferisce
    if(isRefund(t)){const e=refOf(t.rif[0]);return ["cat:"+((e&&e.c)||t.c||"altro"),-t.a]}
    // soldi da un altro conto vostro: non sono entrate (dai risparmi = risparmio ripreso)
    const c=counterpart(t)||pCounter(t,C.patr),ca=c&&conti()[c.acc];
    if(ca){if(C.patr.has(c.acc))return ["sav",-t.a];if(C.fam&&payers().includes(ca.pb))return ["in:vers:"+ca.pb,t.a];return null}
    if(ownName(t.m||""))return ["sav",-t.a];

  if(t.k!=="spesa"||t.s===CASH||isPatrCost(t)||paidByPatr(t))return null;

  if(isPatr(t)||pCounter(t,C.patr))return ["sav",-t.a];
  if(C.paid.has(t.id))return ["dl:"+t.id,-t.a];

}
// chiave dell'entrata: le parole significative della descrizione (via "bonifico", "accredito", "da"…), così lo stipendio sta insieme

function incKey(t){const w=norm(t.m||t.x||"").replace(/[^a-z ]/g," ").split(" ").filter(x=>x.length>1&&!INC_STOP.has(x));return w.slice(0,2).join(" ")||"altro"}

function budPropose(y,sc){

      const b=byK[r[0]]||(byK[r[0]]={tot:0,ms:new Set(),mo:Array(12).fill(0)});b.tot+=r[1];b.ms.add(ym);b.mo[+ym.slice(5,7)-1]+=r[1]}

function famFlows(from,to){
  const pSet=new Set(contoList().filter(([k,v])=>ruolo(k)==="patrimonio"&&v.t!=="carta").map(([k])=>k));
  const accs=pageCorrAccs(),F={vers:{},rest:{},altre:0,spese:0,messo:0,altri:0,list:[],toSav:new Set()};
  for(const t of S.all){
    if(!accs.has(t.acc)) continue;
    const txt=norm((t.x||"")+" "+(t.m||""));
    let ym=ymOf(t.d),c=null,ca=null;
    if(t.k==="giroconto"){c=counterpart(t);ca=c&&conti()[c.acc];if(ca&&payers().includes(ca.pb)&&t.a>0)ym=casaYm(c)}
    if(ym<from||ym>to) continue;
    F.list.push(t);
    if(t.k==="giroconto"){
      if(isVincolo(txt)||(ca&&ruolo(c.acc)==="patrimonio")||(!c&&ownName(t.m||""))){F.messo-=t.a;continue}
      if(ca&&payers().includes(ca.pb)){if(t.a>0)F.vers[ca.pb]=(F.vers[ca.pb]||0)+t.a;else F.rest[ca.pb]=(F.rest[ca.pb]||0)-t.a;continue}
      F.altri-=t.a;continue;
    }
    if(isPatr(t)){F.messo-=t.a;continue}
    if(pCounter(t,pSet)){F.messo-=t.a;F.toSav.add(t);continue}
    if(t.k==="entrata"){F.altre+=t.a;continue}
    if(t.k==="spesa"||t.k==="prelievo"){F.spese-=t.a;continue}
  }
  F.inc=Object.values(F.vers).reduce((x,v)=>x+v,0)+F.altre;
  F.restT=Object.values(F.rest).reduce((x,v)=>x+v,0);
  F.rim=F.inc-F.spese-F.messo-F.restT-F.altri;
  return F;
}

// ---------- Risparmi: BBVA, vincoli e linea libera, divisi tra figli e famiglia ----------
function patrCalc(from,to){
  const open=shiftDay(from+"-01",-1),last=to+"-"+String(lastDay(to)).padStart(2,"0"),close=last<today()?last:today();
  const pAcc=contoList().filter(([k,v])=>ruolo(k)==="patrimonio"&&v.t!=="carta");
  const vAcc=contoList().filter(([k,v])=>ruolo(k)!=="patrimonio"&&v.vinc);
  const lAcc=contoList().filter(([k,v])=>ruolo(k)!=="patrimonio"&&v.lib);
  let s0=0,s1=0;const miss=[],comp=[];
  for(const [k,v] of pAcc){const a=balAt(k,open),b=balAt(k,close);if(a==null||b==null){miss.push(v.n);continue}s0+=a;s1+=b;comp.push([v.n,b])}
  for(const [k,v] of vAcc){const a=vincAt(k,open),b=vincAt(k,close);s0+=a;s1+=b;comp.push([v.n+" · vincolato",b])}
  for(const [k,v] of lAcc){const a=libAt(k,open),b=libAt(k,close);s0+=a;s1+=b;comp.push([v.n+" · linea libera",b])}
  const pSet=new Set(pAcc.map(([k])=>k)),corr=new Set(contoList().filter(([k,v])=>v.t!=="carta"&&ruolo(k)==="corrente").map(([k])=>k));
  let vers=0,intr=0,spent=0;
  const inP=ym=>ym>=from&&ym<=to;
  for(const t of S.all){
    const ym=ymOf(t.d);
    if(corr.has(t.acc)){
      // vincoli e bonifici verso i risparmi contano qualunque tipo abbia la riga (spesa, entrata o giroconto)
      if(isCardText(t)||t.s===CASH||t.k==="prelievo") continue;
      if(isVincolo(norm((t.x||"")+" "+(t.m||"")))){if(inP(ym))vers-=t.a;continue}
      const c=pCounter(t,pSet);
      if(c){if(inP(ymOf(c.d)))vers-=t.a;continue}
      if(t.k==="giroconto"&&inP(ym)&&!counterpart(t)&&ownName(t.m||""))vers-=t.a;
      continue;
    }
    if(!inP(ym)) continue;
    if(pSet.has(t.acc)){
      if(pCounter(t,corr)) continue;
      if(t.k==="entrata"||isPatrCost(t))intr+=t.a;else if(t.k==="spesa")spent-=t.a}
  }
  return {open,close,s0,s1,vers,intr,spent,diff:s1-(s0+vers+intr-spent),comp,miss,any:pAcc.length+vAcc.length+lAcc.length};
}

function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x||1)));const m=x/p;return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p}

// Controparte di un bonifico tra i vostri conti: stesso importo di segno opposto, entro 6 giorni (festività)
function counterpart(t){
  if(isVincolo(norm((t.x||"")+" "+(t.m||"")))||isCardText(t)) return null;
  for(const o of S.all){
    if(o===t||(t.acc&&o.acc===t.acc)) continue;
    if(o.s===FLOWS.carta||o.s===CASH||o.k==="prelievo") continue;
    if(isVincolo(norm((o.x||"")+" "+(o.m||"")))) continue;
    if(Math.abs(o.a+t.a)<0.01&&dayDiff(o.d,t.d)<=6) return o;
  }
  return null;
}
// Controparte cercata solo tra certi conti (es. i risparmi): vale anche se la riga non è stata letta come giroconto
const RE_NOTX=/(interess|bollo|imposta|ritenut|commission|canone|competenze)/;
function pCounter(t,set){
  if(isCardText(t)||t.s===CASH||t.k==="prelievo"||RE_NOTX.test(norm((t.x||"")+" "+(t.m||"")))) return null;
  const key=[...set].sort().join("|");
  if(pCounter.all!==S.all){pCounter.all=S.all;pCounter.m={}}
  const list=pCounter.m[key]=pCounter.m[key]||S.all.filter(o=>set.has(o.acc));
  for(const o of list){
    if(o===t||o.acc===t.acc) continue;
    if(o.s===FLOWS.carta||o.s===CASH||o.k==="prelievo") continue;
    if(Math.abs(o.a+t.a)>=0.01||dayDiff(o.d,t.d)>6) continue;
    if(RE_NOTX.test(norm((o.x||"")+" "+(o.m||"")))) continue;
    // se nessuna delle due righe è un giroconto, solo importi da almeno 100 €
    if(t.k!=="giroconto"&&o.k!=="giroconto"&&(Math.abs(t.a)<100)) continue;
    return o;
  }
  return null;
}
// Pagina personale: soldi spostati verso conti comuni e altri conti vostri, raggruppati per destinazione
function jointFlows(tx){
  const groups={};
  for(const t of tx){
    if(t.k!=="giroconto"||t.s===FLOWS.carta) continue;
    if(isCardText(t)||isVincolo(norm((t.x||"")+" "+(t.m||"")))) continue;
    const c=counterpart(t),ca=c&&conti()[c.acc];
    if(ca&&ca.pb===S.page) continue;
    const name=ca?ca.n:(ownName(t.m||"")?"Altri conti vostri":"Altri giroconti");
    const g=groups[name]=groups[name]||{name,joint:!!(ca&&ca.pb===JOINT),out:0,in:0};
    if(t.a<0) g.out-=t.a; else g.in+=t.a;
  }
  const list=Object.values(groups).sort((a,b)=>(b.joint-a.joint)||(b.out-a.out));
  return {groups:list,net:list.filter(g=>g.joint).reduce((x,g)=>x+g.out-g.in,0)};
}

// Saldi: un saldo noto (dalla banca o inserito a mano) e i movimenti importati danno il saldo a ogni data
function periodEnd(){const e=S.per.to+"-"+String(lastDay(S.per.to)).padStart(2,"0");return e<today()?e:today()}
function rollFrom(anchor,list,date,delta){
  let v=anchor.v;
  for(const t of list){const x=delta(t);if(!x)continue;if(date>=anchor.d){if(t.d>anchor.d&&t.d<=date)v+=x}else if(t.d>date&&t.d<=anchor.d)v-=x}
  return Math.round(v*100)/100;
}
function accTx(id){return S.all.filter(t=>t.acc===id)}
function balAt(id,date){const c=conti()[id];return c&&c.bal?rollFrom(c.bal,accTx(id),date,t=>t.a):null}
// la riga del capitale riporta anche "Interessi Lordi": si esclude solo la riga degli interessi ("Liquidazione Interessi ...")
function isVincMove(t){const x=norm((t.x||"")+" "+(t.m||""));return /(apertura|liquidazione) (linea )?vincolat|apertura vincolo|estinzione vincolo|svincolo/.test(x)&&!/libera/.test(x)&&!/liquidazione interessi|interessi a credito|bollo|imposta/.test(x)}
// Linea libera: versamenti e svincoli che passano dal conto corrente Widiba
function isLibMove(t){const x=norm((t.x||"")+" "+(t.m||""));return /libera/.test(x)&&!/interess|bollo|imposta|ritenut/.test(x)}
function libAt(id,date){const c=conti()[id];return c&&c.lib?rollFrom(c.lib,accTx(id),date,t=>isLibMove(t)?-t.a:0):null}
function vincAt(id,date){const c=conti()[id];return c&&c.vinc?rollFrom(c.vinc,accTx(id),date,t=>isVincMove(t)?-t.a:0):null}
// Carta: spese dopo l'ultimo estratto già addebitato
function cardDebt(id,date){
  let E=null;for(const t of ccOut()) if(isCardText(t)&&t.d<=date){const e=stmtOf(t);if(!E||e>E)E=e}
  const from=E?cycleEnd(E,cardCut()):"0000-00-00";
  return -sum(cardTx().filter(t=>t.acc===id&&t.d>from&&t.d<=date));
}
function bankCheck(id){
  const c=conti()[id];if(!c||!c.bal||!c.bks||!c.bks.length) return null;
  const res=c.bks.map(b=>({d:b.d,bank:b.v,calc:balAt(id,b.d)})).map(r=>({...r,diff:Math.round((r.calc-r.bank)*100)/100}));
  const bad=res.filter(r=>Math.abs(r.diff)>0.01);
  return {res,bad,last:res[res.length-1]};
}
// ---------- Patrimonio e corrente ----------
// Ruolo del conto: "patrimonio" per i risparmi fermi (BBVA), "corrente" per i conti del mese
function ruolo(acc){const c=conti()[acc];return c?(c.ruolo||(c.t==="ris"?"patrimonio":"corrente")):"corrente"}
// Sui conti correnti (Widiba) linea libera, vincoli, loro interessi e bolli appartengono al patrimonio
const RE_PATR=/(vincol|linea libera|interessi a credito|prod\.?\s?finanziari)/i;
function isPatr(t){if(t.s===CASH)return false;if(conti()[t.acc]&&ruolo(t.acc)==="patrimonio")return true;return RE_PATR.test(norm((t.x||"")+" "+(t.m||"")))}
// Costi del patrimonio (bolli, ritenute, commissioni): vanno nel rendimento netto, non tra le uscite del mese
function isPatrCost(t){return t.k==="spesa"&&isPatr(t)&&/(bollo|imposta|ritenut|commission|spese tenuta|oneri)/.test(norm((t.x||"")+" "+(t.m||"")))}
function paidByPatr(t){return t.k==="spesa"&&isPatr(t)&&!isPatrCost(t)}
// Soldi passati tra corrente e patrimonio nel periodo: positivo = messo da parte
function patrFlows(tx){
  let out=0,back=0,rend=0,spent=0;
  for(const t of tx){
    const p=isPatr(t),corr=!p&&conti()[t.acc];

`;

// Confronto tra addebiti della carta sul conto e spese dell'estratto carta del mese prima
function vCardCheck(){
  const hasCard=S.all.some(t=>t.s===FLOWS.carta);
  const cut=cardCut();
  // una riga per estratto carta: l'addebito può arrivare il mese dopo o anche più tardi
  const all=[];for(let ym=S.per.from;ym<=shiftYM(S.per.to,3);ym=shiftYM(ym,1)) all.push(...cardCharges(ym).filter(inPage));
  // nella pagina personale contano solo le carte di quella persona
  const A=pageAccs(),myCards=contoList().filter(([k,v])=>v.t==="carta"&&(!A||A.has(k))).map(([k])=>k);
  const spentE=E=>A?myCards.reduce((x,k)=>x+cardSpent(E,cut,k),0):cardSpent(E,cut);
  const rows=perMonths().map(m=>shiftYM(m,-1)).map(E=>{
    const list=all.filter(t=>stmtOf(t)===E),[from,to]=cardRange(E,cut);
    // dettaglio per carta, quando il numero finale nell'addebito corrisponde a un conto carta
    // senza numero associato, provo il conto carta le cui spese del ciclo coincidono con l'addebito
    const cardAccs=myCards;
    const cards=list.map(t=>{const l4=cardLast4(t),E=stmtOf(t);let acc=cardContoOf(l4);
      if(!acc) acc=cardAccs.find(k=>Math.abs(cardSpent(E,cut,k)+t.a)<=1)||null;
      // importi diversi: la carta della stessa persona intestataria del conto addebitato, se è una sola
      if(!acc){const pb=(conti()[t.acc]||{}).pb,same=cardAccs.filter(k=>conti()[k].pb===pb);if(same.length===1)acc=same[0]}
      return {t,l4,acc,sp:acc?cardSpent(E,cut,acc):null}});
    return {E,list,cards,from,to,ch:-sum(list),sp:spentE(E)};
  }).filter(r=>r.ch>0.004||r.sp>0.004);
  const sus=perTx().filter(inPage).filter(t=>t.s!==FLOWS.carta&&t.s!==CASH&&(t.k==="spesa"||t.k==="entrata")).map(t=>{
    const v=isVincolo(norm(t.x+" "+t.m));
    const c=!v&&t.s===FLOWS.cc&&t.k==="spesa"&&t.a<0?cardCharge(t.d,t.a):null;
    const w=v||c?null:ownTransfer(t.d,t.a,t.acc,flowOf(t));
    const o=v||c||w?null:ownName(t.m||"");
    return {t,why:v?(t.a<0?"Vincolo: soldi spostati sul conto vincolato":"Vincolo: capitale restituito alla scadenza"):c?"Addebito carta: "+c:w?"Trasferimento tra i vostri conti: "+w:o?"Bonifico con un vostro conto: "+titleCase(o):null};
  }).filter(x=>x.why);
  if(!rows.length&&!sus.length) return "";
  return `<section class="block"><h2>Carta di credito e trasferimenti</h2>
    ${sus.length?`<p class="banner">Questi movimenti sembrano l’addebito della carta, un vincolo o uno spostamento tra i vostri conti, ma contano come spesa o entrata. Così verrebbero contati due volte.</p>
      ${sus.map(({t,why})=>`<div class="rules" style="margin-bottom:8px"><div><span><b>${h(t.m)}</b> · ${ddmm(t.d)}<br><span class="hint">${h(why)}</span></span><span class="num" style="white-space:nowrap">${t.a>0?"+":"−"}${eur(Math.abs(t.a))}</span></div><div><span class="hint" style="margin:0">${h(srcName(t))}</span><button class="link" data-act="mkgiro" data-id="${h(t.id)}" ${S.canWrite?"":"disabled"}>Segna come giroconto</button></div></div>`).join("")}`:""}
    ${rows.length?`<div class="recon num"><span class="h">Estratto · addebitato sul conto</span><span class="h">Spese carta del ciclo</span><span class="h">Esito</span></div>
      ${rows.map(r=>{const d=r.ch-r.sp,ok=Math.abs(d)<=1,miss=!r.list.length;return `<details class="rrow"><summary class="recon num">
        <span>${h(monthName(r.E))} · ${miss?"—":eur(r.ch)}</span><span>${eur(r.sp)}</span><span class="${ok?"ok":"ko"}">${ok?"Torna":miss?"Addebito non trovato":(d>0?"+":"−")+eur(Math.abs(d))}</span></summary>
        <div class="hint">Estratto di ${h(ymLabel(r.E))}: spese carta dal ${ddmm(nextDay(r.from))} al ${ddmm(r.to)}, al netto dei rimborsi. Sotto, gli addebiti sul conto per questo estratto.</div>
        ${r.list.length?r.cards.map(({t,l4,acc,sp})=>{const dd=sp==null?null:-t.a-sp;return `<button class="tx" data-act="edit" data-id="${h(t.id)}"><span class="m">${l4?"Carta …"+h(l4)+(acc?" · "+h(conti()[acc].n):""):h(t.m||t.x)}</span><span class="a num">−${eur(-t.a)}</span><span class="meta"><span>${h(srcName(t))}</span><span class="num">${ddmm(t.d)}</span>${sp!=null?`<span>spese della carta ${eur(sp)}</span><span class="${Math.abs(dd)<=1?"":"flag"}">${Math.abs(dd)<=1?"torna":(dd>0?"+":"−")+eur(Math.abs(dd))}</span>`:l4?`<span>importa l’estratto di questa carta per il confronto separato</span>`:""}</span></button>`}).join(""):`<div class="hint">Nessun addebito trovato per l’estratto di ${h(monthName(r.E))}. Se l’addebito non è ancora arrivato è normale; altrimenti aprilo da Movimenti e controlla la descrizione.</div>`}
        ${(()=>{const ex=S.all.filter(t=>t.s===FLOWS.carta&&t.k!=="spesa"&&t.k!=="prelievo"&&t.d>r.from&&t.d<=r.to&&(!A||A.has(t.acc)));
          return (ex.length?`<div class="hint" style="margin-top:10px"><b>Movimenti della carta non contati</b> perché non sono segnati come spesa: se sono spese, aprili e cambia il tipo.</div>${ex.map(t=>txRow(t,true)).join("")}`:"")+
          `<div class="btns" style="margin:10px 0 4px">${myCards.map(k=>`<button class="btn ghost" data-act="cardmovs" data-acc="${h(k)}" data-e="${r.E}" style="padding:8px 12px">Vedi le spese di ${h(conti()[k].n)}</button>`).join("")}</div>`})()}
      </details>`}).join("")}
    <p class="hint" style="padding-bottom:10px">${hasCard?`Ogni riga è un estratto della carta. Toccala per vedere gli addebiti contati, carta per carta. L’estratto carta chiude ${cut?cut+(cut===1?" giorno":" giorni")+" prima della fine del mese":"l’ultimo giorno del mese"}${cut===2?"":" (stimato dai vostri dati)"}. L’addebito sul conto non conta come spesa: contano le singole spese della carta.`:"Importa anche l’estratto della carta per confrontarlo con l’addebito sul conto."}</p>`:""}
  </section>`;
}

  return `<button class="tx" data-act="edit" data-id="${h(t.id)}">
    <span class="m">${h(t.m||t.x||"Movimento")}</span><span class="a num ${amtCls}">${sign}${eur(Math.abs(t.a))}</span>

      ${k==="spesa"&&t.p?`<span>per ${h(t.p)}</span>`:""}${t.pb&&(k==="spesa"||k==="prelievo")?`<span>${k==="prelievo"?"prelevati da":"pagata da"} ${h(t.pb)}</span>`:""}<span>${h(t.s===CASH?"contanti":srcName(t))}</span>${showDate?`<span class="num">${ddmm(t.d)}</span>`:""}${low?`<span class="flag">da verificare</span>`:""}${k==="spesa"&&spType(t)==="straordinaria"&&t.a<0?`<span class="flag">straordinaria</span>`:""}${isRefund(t)?`<span class="tag">rimborso di ${h((refOf(t.rif[0])||{}).m||"una spesa")}${t.rif.length>1?" e altre":""}</span>`:""}${k==="spesa"&&t.a<0&&refundMap()[keyOf(t)||t.id]?`<span class="tag">rimborsata ${eur(refundMap()[keyOf(t)||t.id].reduce((x,r)=>x+r.a,0))}</span>`:""}</span>

function vMovs(){
  const f=S.f,q=norm(f.q);
  let list=(q?S.all:perTx()).filter(inPage);
  if(q) list=list.filter(t=>norm(t.m+" "+t.x+" "+(t.n||"")).includes(q));
  if(f.c) list=list.filter(t=>t.k==="spesa"&&(t.c||"altro")===f.c);
  if(f.p) list=list.filter(t=>t.p===f.p);
  if(f.s) list=list.filter(t=>srcName(t)===f.s);
  if(f.pb) list=list.filter(t=>t.pb===f.pb);
  if(f.ty) list=list.filter(t=>t.k==="spesa"&&spType(t)===f.ty);
  const ms=S.msort||"data",byVal=ms==="importo";
  if(byVal) list=[...list].sort((x,y)=>((x.k==="spesa"?0:1)-(y.k==="spesa"?0:1))||Math.abs(y.a)-Math.abs(x.a)||y.d.localeCompare(x.d));
  if(ms==="nome") list=[...list].sort((x,y)=>String(x.m).localeCompare(String(y.m),"it")||y.d.localeCompare(x.d));
  const spent=-sum(list.filter(t=>t.k==="spesa"));
  let html=`${pageSeg()}<div class="filters">
    <input type="search" id="fq" placeholder="Cerca esercente o descrizione" value="${h(f.q)}" aria-label="Cerca">
    <select id="fc" aria-label="Categoria"><option value="">Tutte le categorie</option>${CATS.map(([id,n])=>`<option value="${id}" ${f.c===id?"selected":""}>${h(n)}</option>`).join("")}</select>
    <select id="fp" aria-label="Beneficiario"><option value="">Ogni beneficiario</option>${members().map(m=>`<option ${f.p===m?"selected":""}>${h(m)}</option>`).join("")}</select>
    <select id="fpb" aria-label="Sostenuta da"><option value="">Chiunque abbia pagato</option>${payerOpts().map(m=>`<option ${f.pb===m?"selected":""}>${h(m)}</option>`).join("")}</select>
    <select id="fty" aria-label="Tipo di spesa"><option value="">Ogni tipo di spesa</option>${Object.entries(TIPI).map(([k,n])=>`<option value="${k}" ${f.ty===k?"selected":""}>${h(n)}</option>`).join("")}</select>
    <select id="fs" aria-label="Mezzo"><option value="">Ogni mezzo</option>${(()=>{const ok=new Set(S.all.filter(inPage).map(srcName));return sources().filter(m=>ok.has(m)||m===f.s)})().map(m=>`<option ${f.s===m?"selected":""}>${h(m)}</option>`).join("")}</select>
  </div>
  <div class="toolbar"><div class="seg sm four" role="group" aria-label="Ordina per">${[["data","Data"],["importo","Importo"],["nome","Nome"],["esercente","Esercente"]].map(([k,n])=>`<button data-act="msort" data-s="${k}" aria-pressed="${ms===k}">${n}</button>`).join("")}</div><span class="hint num" style="margin:0">${list.length} movimenti${q?" in tutti i mesi":""} · spese ${eur(spent)}</span></div>`;
  if(!list.length) return html+`<p class="hint" style="margin-top:20px">Nessun movimento con questi filtri.${(f.c||f.p||f.s||f.q||f.pb||f.ty)?` <button class="link" data-act="clearf">Togli i filtri</button>`:""}</p>`;
  let cur="";
  if(byVal||ms==="nome") return html+list.map(t=>txRow(t,true)).join("");
  if(ms==="esercente") return html+vGroups(list);
  for(const t of list){
    if(t.d!==cur){cur=t.d;const [y,m,d]=t.d.split("-").map(Number);html+=`<div class="day">${h(new Date(y,m-1,d).toLocaleDateString("it-IT",{weekday:"short",day:"numeric",month:"long",year:q||S.per.from.slice(0,4)!==S.per.to.slice(0,4)?"numeric":undefined}))}</div>`}
    html+=txRow(t);
  }
  return html;
}
// Movimenti accorpati per esercente: categoria e beneficiario si scelgono una volta per tutto il gruppo
function vGroups(list){
  const g={};
  for(const t of list){if(t.k!=="spesa")continue;const k=mkey(t.m)||norm(t.m)||"?";const o=g[k]=g[k]||{k,name:t.m,list:[],tot:0,cats:{},ps:{}};o.list.push(t);o.tot-=t.a;const c=t.c||"altro";o.cats[c]=(o.cats[c]||0)+1;o.ps[t.p||members()[0]]=(o.ps[t.p||members()[0]]||0)+1}
  const arr=Object.values(g).sort((a,b)=>b.tot-a.tot);

        <select data-gc="${h(o.k)}" aria-label="Categoria per ${h(o.name)}" ${S.canWrite?"":"disabled"}>${c?"":`<option value="">Categorie diverse…</option>`}${CATS.map(([id,n])=>`<option value="${id}" ${c===id?"selected":""}>${h(n)}</option>`).join("")}</select>
        <select data-gp="${h(o.k)}" aria-label="Beneficiario per ${h(o.name)}" ${S.canWrite?"":"disabled"}>${p?"":`<option value="">Beneficiari diversi…</option>`}${members().map(m=>`<option ${p===m?"selected":""}>${h(m)}</option>`).join("")}</select>

// Spese in contanti ricorrenti (pulizie, baby sitter…): le più registrate negli ultimi 6 mesi, con l'ultimo importo
function cashFreq(){
  const from=shiftYM(ymOf(today()),-6)+"-01",g={};
  for(const t of S.all){if(t.s!==CASH||t.k!=="spesa"||t.d<from)continue;const k=norm(t.m);if(!k)continue;const o=g[k]=g[k]||{n:0,last:null};o.n++;if(!o.last||t.d>o.last.d||(t.d===o.last.d&&(t.t||0)>(o.last.t||0)))o.last=t}
  return Object.values(g).sort((a,b)=>b.n-a.n||b.last.d.localeCompare(a.last.d)).slice(0,8).map(o=>o.last);
}

function pRow(r){
  const byTxt=r.gw&&r.k==="giroconto"?r.gw:r.cb==="Claude"?`Riconosciuto da Claude · ${Math.round((r.f||0)*100)}%`:r.cb==="regola"?"Regola salvata":r.cb==="dizionario"?"Riconosciuto dal nome":r.cb==="manuale"?"Scelto da te":r.k==="spesa"?"Da classificare":"";
  const low=r.k==="spesa"&&(!r.c||(r.cb==="Claude"&&(r.f||0)<0.6));
  return `<div class="prow ${r.dup?"dup":""}">
    <div class="top"><span class="d num">${r.d.slice(8,10)}/${r.d.slice(5,7)}</span><span class="m">${h(r.m)}</span><span class="num" style="font-weight:700">${r.a>0?"+":"−"}${eur(Math.abs(r.a))}</span></div>
    <div class="x">${h(r.x)}</div>
    ${r.dup?"":`<div class="ctrl">
      ${r.k==="spesa"?`<select class="full" data-pc="${h(r.id)}" aria-label="Categoria"><option value="">Scegli categoria…</option>${CATS.map(([id,n])=>`<option value="${id}" ${r.c===id?"selected":""}>${h(n)}</option>`).join("")}</select>`:`<span class="hint full">${h(KINDS[r.k])}</span>`}
      ${r.k==="spesa"?`<select data-pp="${h(r.id)}" aria-label="Beneficiario">${members().map(m=>`<option ${r.p===m?"selected":""}>${h(m)}</option>`).join("")}</select>`:""}
      <select ${r.k==="spesa"?"":'class="full"'} data-pk="${h(r.id)}" aria-label="Tipo">${Object.entries(KINDS).map(([k,n])=>`<option value="${k}" ${r.k===k?"selected":""}>${h(n)}</option>`).join("")}</select>
    </div>
    ${byTxt?`<div class="by ${low?"low":""}">${h(byTxt)}</div>`:""}`}
  </div>`;
}

function openSheet(html){$("#sheet").innerHTML=`<div class="grab"></div>`+html;$("#scrim").classList.add("on");$("#sheet").classList.add("on");const f=$("#sheet").querySelector("input,select,button");if(f)setTimeout(()=>f.focus({preventScroll:true}),60)}
// Trascinando in giù la finestra (dalla maniglia, o quando è già in cima) si chiude, come le schede di iOS
(function(){
  const sh=document.getElementById("sheet");let y0=null,dy=0;
  sh.addEventListener("touchstart",e=>{if(!sh.classList.contains("on")||e.target.closest("input,select,textarea"))return;if(sh.scrollTop>0&&!e.target.closest(".grab"))return;y0=e.touches[0].clientY;dy=0},{passive:true});
  sh.addEventListener("touchmove",e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;if(dy>0&&sh.scrollTop<=0){sh.style.transition="none";sh.style.transform=`translateY(${dy}px)`;e.preventDefault()}else if(dy<0){y0=null;sh.style.transform=""}},{passive:false});
  sh.addEventListener("touchend",()=>{if(y0==null)return;y0=null;sh.style.transition="";sh.style.transform="";if(dy>90)closeSheet()});
})();
function closeSheet(){stopScan();try{S.wake&&S.wake.release()}catch(_){}S.wake=null;$("#scrim").classList.remove("on");$("#sheet").classList.remove("on");S.sheet=null;if(S.dirty){S.dirty=false;render()}}

async function saveEdit(){
  const t=S.byId[S.sheet.id];if(!t) return;
  const raw=$("#ea").value.trim().replace(/^[−–]/,"-"),a=num(raw);if(isNaN(a)||a===0){toast("Inserisci un importo valido.");return}
  const signed=/^[+-]/.test(raw);
  const k=$("#ek").value;
  const nd=readDate("ed");if($("#ed").value.trim()&&!nd){toast("Data non valida: scrivila come gg/mm/aaaa.");$("#ed").focus();return}
  const nt={...t,m:$("#em").value.trim()||t.m,d:nd||t.d,k,c:k==="spesa"?$("#ec").value:null,p:$("#ep").value,pb:$("#epb").value,ty:k==="spesa"?($("#ety").value||null):null,...(conti()[$("#es").value]?{acc:$("#es").value,s:FLOWS[conti()[$("#es").value].t]||FLOWS.cc}:{acc:"",s:$("#es").value}),n:$("#en").value.trim(),cb:"manuale",f:null};
  // il segno scritto vale (spesa negativa, rimborso positivo); entrate sempre positive, prelievi sempre negativi
  nt.a=k==="entrata"?Math.abs(a):k==="prelievo"?-Math.abs(a):signed?(raw[0]==="+"?Math.abs(a):-Math.abs(a)):(t.a>0&&k==="spesa"?Math.abs(a):-Math.abs(a));
  try{
    if(ymOf(nt.d)!==ymOf(t.d)) await delTx(t);
    const changes=[nt];
    const rule=$("#erule")&&$("#erule").checked&&k==="spesa";
    if(rule){
      const key=mkey(nt.m);
      for(const o of S.all) if(o.id!==nt.id&&o.k==="spesa"&&o.cb!=="manuale"&&mkey(o.m)===key&&(o.c!==nt.c||o.p!==nt.p)) changes.push({...o,c:nt.c,p:nt.p,cb:"regola"});
      await putTx(changes);
      await saveSettings({rules:{[key]:{c:nt.c,p:nt.p}}});
    } else await putTx(changes);
    if(t.acc) await saveFixes([[keyOf(t),fixFields(nt,"manuale")]]);
    closeSheet();toast(changes.length>1?`Salvato, aggiornati altri ${changes.length-1} movimenti`:"Modifiche salvate");
  }catch(e){toast(errMsg(e))}
}

// Medie mensili degli ultimi 12 mesi interi (o dei mesi con dati, se sono meno): spese per categoria ed entrate
function avg12(){
  const cur=ymOf(today()),to=shiftYM(cur,-1),first=S.all.length?ymOf(S.all[S.all.length-1].d):cur;
  let from=shiftYM(cur,-12);if(first>from)from=first;
  let n=0;for(let ym=from;ym<=to;ym=shiftYM(ym,1))n++;
  const cat={};let inc=0;
  if(n>0) for(const t of S.all){const ym=ymOf(t.d);if(ym<from||ym>to)continue;
    if(t.k==="spesa"){if(isPatrCost(t)||paidByPatr(t)||spType(t)==="straordinaria")continue;const c=t.c||"altro";cat[c]=(cat[c]||0)-t.a/n}
    else if(t.k==="entrata"&&!isPatr(t))inc+=t.a/n}
  return {n,from,to,cat,inc};
}

async function exportCSV(scope){
  let list=S.all;
  if(scope==="per") list=perTx(); else if(scope==="year") list=S.all.filter(t=>t.d.startsWith(S.per.to.slice(0,4)));
  if(!list.length){toast("Nessun movimento da esportare.");return}
  const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const lines=["Data;Esercente;Descrizione;Tipo;Categoria;Beneficiario;Sostenuta da;Mezzo;Nota;Importo"];
  for(const t of [...list].reverse()) lines.push([t.d.split("-").reverse().join("/"),t.m,t.x,KINDS[t.k||"spesa"],t.k==="spesa"?(CAT[t.c]||CAT.altro).n:"",t.p,t.pb,t.s,t.n,String(t.a.toFixed(2)).replace(".",",")].map(q).join(";"));
  const data="\uFEFF"+lines.join("\r\n");
  const name="spese-famiglia-"+(scope==="per"?(S.per.from===S.per.to?S.per.from:S.per.from+"_"+S.per.to):scope==="year"?S.per.to.slice(0,4):"tutto")+".csv";
  const url=URL.createObjectURL(new Blob([data],{type:"text/csv;charset=utf-8"}));
  const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
}

document.addEventListener("change",async e=>{
  const t=e.target,id=t.id;
  if(id==="file"){handleFile(t.files[0]);t.value="";return}

  if(id==="kphoto"&&t.files[0]){try{const img=await loadImg(t.files[0]);if(S.sheet){S.sheet.foto=shrink(img,640,.72);paintPrev();const m=$("#klogo");if(m)m.textContent="Usa la foto della tessera."}}catch(_){toast("Foto non leggibile.")}t.value="";return}
  if(id==="ksite"){if(S.sheet)S.sheet.auto=false;refreshLogo();return}
  if(id==="kn"){const sh=S.sheet;if(sh&&sh.cardEdit&&(sh.auto||!$("#ksite").value.trim())){$("#ksite").value=cardSite(t.value);sh.auto=true;refreshLogo()}paintPrev();return}
