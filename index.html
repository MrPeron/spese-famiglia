<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spese di famiglia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1E5A45">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --sunk:#E3E9E5; --ink:#15302A; --muted:#5B6E66; --line:#D3DDD8;
  --primary:#1E5A45; --on-primary:#FFFFFF; --ochre:#B8730F; --ochre-soft:#F6E7CC; --danger:#B03A32; --ok:#2E7D55;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1814; --surface:#16231E; --sunk:#1D2D27; --ink:#E3EEE8; --muted:#94A89F; --line:#2A3B34;
    --primary:#5DBE95; --on-primary:#0E1814; --ochre:#E6A644; --ochre-soft:#3A2C14; --danger:#E5786F; --ok:#6CCB9A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1814; --surface:#16231E; --sunk:#1D2D27; --ink:#E3EEE8; --muted:#94A89F; --line:#2A3B34;
  --primary:#5DBE95; --on-primary:#0E1814; --ochre:#E6A644; --ochre-soft:#3A2C14; --danger:#E5786F; --ok:#6CCB9A;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 120px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 16px 10px;max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{font:800 1.05rem/1 var(--display);letter-spacing:-.01em;flex:1}
.month{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.month button{border:0;background:none;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1.1rem;color:var(--muted)}
.month .plab{min-width:118px;text-align:center;font-weight:600;font-size:.92rem;text-transform:capitalize;border:0;background:none;cursor:pointer;padding:0 4px;white-space:nowrap;color:var(--ink)}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;padding:10px 4px 9px;cursor:pointer;color:var(--muted);font-size:.78rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--primary)}

.banner{margin:4px 0 14px;padding:10px 14px;border-radius:10px;background:var(--ochre-soft);color:var(--ink);font-size:.9rem}

/* Riepilogo */
.hero{padding:18px 2px 6px}
.hero .lbl{color:var(--muted);font-size:.95rem}
.hero .big{font:800 clamp(2.6rem,11vw,3.6rem)/1.02 var(--display);letter-spacing:-.03em;margin:2px 0 6px}
.hero .big small{font-size:.5em;font-weight:700;color:var(--muted);margin-left:2px}
.delta{font-size:.9rem;color:var(--muted)}
.delta b{color:var(--ink)}
.ribbon{display:flex;height:16px;border-radius:5px;overflow:hidden;margin:16px 0 4px;background:var(--sunk);gap:2px}
.ribbon i{display:block;height:100%;min-width:3px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 16px;margin-top:16px}
.block h2{font:700 1.02rem/1.2 var(--display);margin:12px 0 6px}
.row{display:grid;grid-template-columns:12px 1fr auto;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}
.row:first-of-type{border-top:0}
.dot{width:12px;height:12px;border-radius:4px}
.row .bar{grid-column:2/4;height:4px;border-radius:2px;background:var(--sunk);margin-top:-4px;overflow:hidden}
.row .bar i{display:block;height:100%}
.row .amt{font-weight:600}
.row .pct{color:var(--muted);font-weight:500;font-size:.85rem;margin-left:8px}
.cashgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:6px 0 14px}
.cashgrid div{background:var(--sunk);border-radius:10px;padding:10px}
.cashgrid span{display:block;color:var(--muted);font-size:.8rem}
.cashgrid b{font:700 1.1rem/1.3 var(--display)}
.cashgrid .warn{background:var(--ochre-soft)}
.cashgrid .warn b{color:var(--ochre)}
.empty{padding:28px 4px;text-align:left}
.empty h1{font:800 1.9rem/1.1 var(--display);letter-spacing:-.02em;margin:10px 0}
.empty p{color:var(--muted);max-width:52ch}

/* bottoni */
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--primary);color:var(--on-primary)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--danger);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.link{background:none;border:0;color:var(--primary);font-weight:600;cursor:pointer;padding:0}

/* Movimenti */
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 10px}
.filters input{grid-column:1/-1}
input[type=text],input[type=search],input[type=email],input[type=password],input[type=date],input[type=number],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px;min-height:44px}
textarea{min-height:110px;resize:vertical}
.day{font-size:.82rem;color:var(--muted);font-weight:600;margin:16px 2px 6px;text-transform:capitalize}
.tx{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:6px;cursor:pointer}
.tx .m{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .a{font-weight:700;text-align:right}
.tx .a.in{color:var(--ok)}
.tx .a.mute{color:var(--muted)}
.tx .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.82rem;color:var(--muted);align-items:center}
.tag{display:inline-flex;align-items:center;gap:5px}
.tag .dot{width:9px;height:9px;border-radius:3px}
.flag{background:var(--ochre-soft);color:var(--ochre);border-radius:6px;padding:0 6px;font-weight:600}
.sum{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin:4px 2px}

/* Contanti */
.amount-in{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--line);padding:6px 2px 4px;margin:8px 0 14px}
.amount-in:focus-within{border-color:var(--ochre)}
.amount-in span{font:700 2rem var(--display);color:var(--muted)}
.amount-in input{border:0;background:none;font:800 2.6rem/1.1 var(--display);letter-spacing:-.02em;padding:0;min-height:0;width:100%}
.amount-in input:focus-visible{outline:none}
.seg{display:inline-grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:10px;padding:3px;margin:6px 0 4px}
.seg button{border:0;background:none;padding:8px 16px;border-radius:8px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.field{margin:12px 0}
.field>label,.field>.lab{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.88rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .dot{width:9px;height:9px;border-radius:3px}
.hint{font-size:.84rem;color:var(--muted);margin:6px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Importa */
.drop{display:block;border:2px dashed var(--line);border-radius:14px;padding:24px 16px;text-align:center;cursor:pointer;background:var(--surface);margin:12px 0}
.drop b{font:700 1.1rem var(--display);display:block;margin-bottom:4px}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop.over{border-color:var(--ochre)}
.map{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.map label{font-size:.82rem;font-weight:600;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.stats span{background:var(--sunk);border-radius:8px;padding:4px 10px;font-size:.86rem}
.prow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.prow.dup{opacity:.55}
.prow .top{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline}
.prow .d{color:var(--muted);font-size:.82rem}
.prow .m{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .x{font-size:.78rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:2px 0 6px}
.prow .ctrl{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-items:center}
.prow .ctrl .full{grid-column:1/-1}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin:8px 0}
.seg.sm button{padding:6px 12px;font-size:.86rem}
.prow select{min-height:38px;padding:6px 8px;font-size:15px}
.prow .by{font-size:.75rem;color:var(--muted);margin-top:4px}
.prow .by.low{color:var(--ochre);font-weight:600}
.stick{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%);padding:18px 0 8px;display:flex;gap:8px;flex-wrap:wrap}
.stick .btn{flex:1;min-width:150px}
.progress{font-size:.88rem;color:var(--muted);margin:6px 0}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:20;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:18px 18px 0 0;max-height:90vh;overflow:auto;transform:translateY(105%);transition:transform .22s ease;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet h3{font:800 1.35rem/1.2 var(--display);margin:4px 0 2px}
.sheet .sub{color:var(--muted);font-size:.86rem;margin-bottom:6px;word-break:break-word}
.rules{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.rules>div{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;border-top:1px solid var(--line);font-size:.9rem}
.rules>div:first-child{border-top:0}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.92rem;margin:10px 0}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--primary)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){.sheet,.toast{transition:none}}
@media (min-width:640px){.filters{grid-template-columns:repeat(4,1fr)}}

/* Filtri riepilogo, budget, grafico */
.seg.pages{display:grid;grid-template-columns:repeat(3,1fr);width:100%;margin-top:6px}
.filters.hf{grid-template-columns:1fr 1fr;margin-top:12px}
.filters.hf.two2 select:last-child{grid-column:auto}
.filters.hf select:last-child{grid-column:1/-1}
@media (min-width:640px){.filters.hf{grid-template-columns:repeat(3,1fr)}.filters.hf select:last-child{grid-column:auto}}
.bh{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.bh .link{font-size:.9rem;white-space:nowrap}
.bst{grid-column:2/4;font-size:.78rem;color:var(--muted);margin-top:-6px}
.bst.warn{color:var(--ochre);font-weight:600}
.bst.over{color:var(--danger);font-weight:600}
.chart{position:relative;padding:14px 0 4px}
.plot{position:relative;height:180px;margin-left:38px}
.gl,.bl{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--line)}
.gl span{position:absolute;right:calc(100% + 6px);top:-.65em;font-size:.72rem;color:var(--muted);white-space:nowrap}
.bl{border-top:1.5px dashed var(--ink);opacity:.75;z-index:2;pointer-events:none}
.bl span{position:absolute;right:0;top:-1.55em;font-size:.72rem;color:var(--ink);background:var(--surface);padding:0 4px}
.cols{position:absolute;inset:0;display:flex;align-items:flex-end;gap:4px}
.col{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;justify-content:center;background:none;border:0;padding:0;cursor:pointer}
.col .stack{width:100%;max-width:44px;display:flex;flex-direction:column-reverse;gap:2px;border-radius:4px 4px 0 0;overflow:hidden}
.col .stack i{display:block;min-height:0}
.col.dim .stack{opacity:.4}
.col:hover .stack,.col.on .stack{opacity:1}
.xl{display:flex;gap:4px;margin:6px 0 0 38px}
.xl span{flex:1;min-width:0;text-align:center;font-size:.72rem;color:var(--muted);white-space:nowrap}
.ctip{position:absolute;top:8px;z-index:3;background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 10px;font-size:.8rem;width:220px;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.ctip b{display:block;font-size:.88rem;text-transform:capitalize;margin-bottom:2px}
.ctip div{display:flex;justify-content:space-between;gap:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--muted);padding:10px 0 12px}
.recon{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:4px 12px;font-size:.88rem;padding:4px 0;align-items:baseline}
.recon>span:not(:first-child){text-align:right}
.recon .h{color:var(--muted);font-size:.78rem}
.recon .ok{color:var(--ok);font-weight:600}
.recon .ko{color:var(--ochre);font-weight:600}
.rrow{border-top:1px solid var(--line)}
.rrow summary{list-style:none;cursor:pointer;padding:8px 0}
.rrow summary::-webkit-details-marker{display:none}
.rrow[open]{padding-bottom:8px}
.rrow .tx{margin-top:6px}
.bud label{display:grid;grid-template-columns:12px 1fr 110px;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.bud label:first-child{border-top:0}
.bud small{display:block;color:var(--muted);font-size:.78rem}
.bud input{min-height:40px;text-align:right}
.rules .crow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;padding:12px}
.crow select{min-height:38px;padding:6px 8px;font-size:15px}
.bald summary{list-style:none;cursor:pointer;font-size:.9rem}
.bald summary::-webkit-details-marker{display:none}
.bald input{min-height:40px}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Spese di famiglia</div>
  <div class="month" id="monthbox">
    <button data-act="prevm" aria-label="Periodo precedente">‹</button>
    <button id="mlabel" class="plab" data-act="period" aria-label="Scegli il periodo"></button>
    <button data-act="nextm" aria-label="Periodo successivo">›</button>
  </div>
  <button class="iconbtn" data-act="settings" aria-label="Impostazioni">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>
<main class="wrap" id="view"></main>

<nav class="tabs" aria-label="Sezioni"><div class="in">
  <button data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Riepilogo</button>
  <button data-nav="movs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Movimenti</button>
  <button data-nav="cash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/></svg>Contanti</button>
  <button data-nav="imp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>Importa</button>
</div></nav>

<div class="scrim" id="scrim" data-act="close"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, sendPasswordResetEmail, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, onSnapshot, setDoc, deleteField } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
(() => {
"use strict";
const CASH = "Contanti";
const BASE_CATS = [
  ["spesa","Spesa alimentare","#3E8E5A"],["ristoranti","Ristoranti e bar","#D9822B"],
  ["auto","Auto e carburante","#5B6C8F"],["trasporti","Trasporti e pedaggi","#3B7EA1"],
  ["casa","Casa e utenze","#8A6D3B"],["mutuo","Mutuo e prestiti","#2C5F7C"],["arredo","Arredo e fai da te","#A88A5C"],
  ["salute","Salute e farmacia","#C0504D"],["abbigliamento","Abbigliamento","#9B5DA8"],
  ["figli","Figli e scuola","#D9A21F"],["sport","Sport","#2F9C95"],["bellezza","Bellezza","#C46FA6"],
  ["svago","Svago e cultura","#D45D8C"],["viaggi","Viaggi e vacanze","#4A90C2"],

// Addebito della carta di credito sul conto: deve corrispondere al dettaglio dell'estratto carta
function dayDiff(a,b){return Math.abs(Date.parse(a)-Date.parse(b))/86400000}
// Ciclo dell'estratto carta: chiude "cut" giorni prima della fine del mese; l'addebito arriva sul conto il mese dopo
const RE_CARDCHG = /(cart[ae]\s(di\s)?credito|carta credito|saldo carta|estratto conto carta|e\/c carta|addebito e\/c|nexi|cartasi|american express|amex|flexia)/i;
function lastDay(ym){const [y,m]=ym.split("-").map(Number);return new Date(Date.UTC(y,m,0)).getUTCDate()}
function cycleEnd(ym,cut){return ym+"-"+String(lastDay(ym)-cut).padStart(2,"0")}
function nextDay(d){return new Date(Date.parse(d)+86400000).toISOString().slice(0,10)}
function cardTx(){return S.all.filter(t=>t.s===FLOWS.carta&&(t.k==="spesa"||t.k==="prelievo"))}
// E = mese dell'estratto carta ("ESTRATTO 08/2026" nell'addebito UniCredit), altrimenti il mese prima dell'addebito
function stmtOf(t){const m=norm((t.x||"")+" "+(t.m||"")).match(/estratto\s+(?:conto\s+)?(\d{1,2})[\/.\-](\d{4})/);if(m&&+m[1]>=1&&+m[1]<=12) return m[2]+"-"+String(+m[1]).padStart(2,"0");return shiftYM(ymOf(t.d),-1)}
function cardLast4(t){const m=String(t.x||"").toUpperCase().match(/(?:\*{2,}|X{3,}|•{2,})\s?(\d{4})\b/);return m?m[1]:null}
function cardContoOf(l4){const id=l4&&(S.settings.acctok||{})["carta "+l4];return id&&conti()[id]&&conti()[id].t==="carta"?id:null}
function cardRange(E,cut){return [cycleEnd(shiftYM(E,-1),cut),cycleEnd(E,cut)]}
function cardSpent(E,cut,acc){const [from,to]=cardRange(E,cut);return -sum(cardTx().filter(t=>t.d>from&&t.d<=to&&(!acc||t.acc===acc)))}
function ccOut(ym){return S.all.filter(t=>t.s===FLOWS.cc&&t.a<0&&(t.k==="giroconto"||t.k==="spesa")&&(!ym||ymOf(t.d)===ym))}
function isCardText(t){return RE_CARDCHG.test(norm((t.x||"")+" "+(t.m||"")))}
// Stima di quanti giorni prima di fine mese chiude l'estratto (0-5), dai mesi con un addebito carta riconoscibile
function cardCut(){
  const key=S.ver;if(cardCut.k===key) return cardCut.v;
  const byM={};for(const t of ccOut()) if(isCardText(t)) byM[stmtOf(t)]=(byM[stmtOf(t)]||0)-t.a;
  const ms=Object.keys(byM);let best=2,err=Infinity;
  if(ms.length&&cardTx().length) for(const c of [2,0,1,3,4,5]){const e=ms.reduce((s2,ym)=>s2+Math.abs(byM[ym]-cardSpent(ym,c)),0);if(e<err-0.5){err=e;best=c}}
  cardCut.k=key;cardCut.v=best;return best;
}
// Addebiti carta di un mese: per descrizione, oppure giroconto/spesa con lo stesso importo delle spese carta del ciclo
function cardCharges(ym){const sp=cardSpent(shiftYM(ym,-1),cardCut());return ccOut(ym).filter(t=>isCardText(t)||(sp>1&&Math.abs(-t.a-sp)<=1))}
function cardCharge(d,a){
  const amt=Math.abs(a);
  for(const t of S.all) if(t.s===FLOWS.carta&&t.k==="giroconto"&&Math.abs(Math.abs(t.a)-amt)<0.01&&dayDiff(t.d,d)<=45) return "stesso importo del pagamento saldo nell’estratto carta";
  const E=shiftYM(ymOf(d),-1),net=cardSpent(E,cardCut()),[from,to]=cardRange(E,cardCut());
  if(net>1&&Math.abs(net-amt)<=1) return "pari alle spese con la carta dal "+ddmm(nextDay(from))+" al "+ddmm(to);
  return null;
}

// Bonifico tra i vostri conti: stesso importo uscito da un conto ed entrato in un altro entro 6 giorni
function ownTransfer(d,a,acc,flow){
  if(flow==="carta") return null;
  for(const t of S.all){
    if(t.s===FLOWS.carta||t.s===CASH||t.k==="prelievo") continue;
    if(isVincolo(norm((t.x||"")+" "+(t.m||"")))) continue;
    if(acc?t.acc===acc:(!t.acc&&t.s===FLOWS[flow])) continue;
    if(Math.abs(t.a+a)<0.01&&dayDiff(t.d,d)<=6) return (a<0?"entrato lo stesso importo su ":"uscito lo stesso importo da ")+srcName(t)+" il "+ddmm(t.d);
  }
  return null;
}

function detectKind(desc,a,flow){

    return "giroconto";
  }
  if(flow==="carta"){
    if(RE_SALDO.test(t)||RE_GIRO.test(t)) return "giroconto";
    if(a<0&&RE_PREL.test(" "+t)) return "prelievo";
    return "spesa";
  }
  if(RE_GIRO.test(t)) return "giroconto";
  if(a>0&&RE_STORNO.test(t)) return "spesa";
  if(a<0 && RE_PREL.test(" "+t)) return "prelievo";
  if(a>0) return "entrata";
  return "spesa";
}

function detectDelim(text){
  const lines=text.split(/\r?\n/).slice(0,25);let best=";",score=-1;
  for(const d of [";",",","\t","|"]){const c=lines.reduce((t,l)=>t+(l.split(d).length-1),0);if(c>score){score=c;best=d}}
  return best;
}
function parseCSV(text,d){
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch==='"') q=true;
    else if(ch===d){row.push(cell);cell=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(cell);rows.push(row);row=[];cell=""}
    else cell+=ch;
  }
  if(cell!==""||row.length){row.push(cell);rows.push(row)}
  return rows;
}
async function readGrids(file){
  const buf=await file.arrayBuffer();const name=file.name.toLowerCase();
  const isText=/\.(csv|txt|tsv)$/.test(name);
  if(!isText){
    if(!window.XLSX) throw new Error("La lettura dei file Excel non è disponibile ora: esporta in CSV oppure ricarica la pagina.");
    const wb=XLSX.read(buf,{type:"array"});
    return wb.SheetNames.map(n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:""}));
  }
  let text;
  try{text=new TextDecoder("utf-8",{fatal:true}).decode(buf)}catch(e){text=new TextDecoder("windows-1252").decode(buf)}
  text=text.replace(/^\uFEFF/,"");
  return [parseCSV(text,detectDelim(text))];
}
const COLRE = {
  d:/^(data( (contabile|cont\.?|operazione|registrazione|movimento|acquisto|transazione|op\.?))?|date|giorno|data op\.?)$/,
  dv:/data valuta|data val\.?$|valuta/,
  x:/descrizion|causale|dettagli|operazione|esercente|beneficiario|controparte|motivo|description|merchant|note|informazioni|^movimento$|parola chiave|osservazion|concetto/,
  xt:/^(parola chiave|tipo|tipo operazione|tipologia)$/,
  bal:/^(disponibile|saldo|saldo contabile|saldo disponibile|saldo \(eur\))$/,
  a:/^(importo|importi|amount|ammontare|valore|importo (in )?eur|importo euro|importo \(eur\)|importo €)$|^importo/,
  deb:/^(dare|uscit|addebit|debit|addebiti|movimenti dare|importo dare)/,
  cre:/^(avere|entrat|accredit|credit|accrediti|movimenti avere|importo avere)/
};
function findHeader(grid){
  for(let r=0;r<Math.min(grid.length,40);r++){
    const cells=(grid[r]||[]).map(c=>norm(c));
    const has=re=>cells.findIndex(c=>c&&re.test(c));
    let d=has(COLRE.d); if(d<0) d=has(COLRE.dv);
    const a=has(COLRE.a),deb=has(COLRE.deb),cre=has(COLRE.cre);
    if(d>=0&&(a>=0||deb>=0||cre>=0)){
      const xs=[];cells.forEach((c,i)=>{if(c&&COLRE.x.test(c)&&i!==d&&!COLRE.dv.test(c))xs.push(i)});
      return {hdr:r,map:{d,bal:has(COLRE.bal),x1:xs[0]??-1,x2:xs[1]??-1,x3:xs[2]??-1,a:(deb>=0&&cre>=0&&a<0)?-1:a,deb:a>=0?-1:deb,cre:a>=0?-1:cre}};
    }
  }
  return null;
}
function num(v){
  if(typeof v==="number") return v;
  let s=String(v??"").trim(); if(!s) return NaN;
  const neg=/^\(.*\)$/.test(s)||/^-/.test(s.replace(/[€\s+]/g,""))||/-\s*$/.test(s);
  s=s.replace(/[^\d,.]/g,"");
  if(!s) return NaN;
  if(s.includes(",")&&s.includes(".")){ s = s.lastIndexOf(",")>s.lastIndexOf(".") ? s.replace(/\./g,"").replace(",",".") : s.replace(/,/g,"") }
  else if(s.includes(",")) s=s.replace(/\./g,"").replace(",",".");
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,"");
  const n=parseFloat(s); return isNaN(n)?NaN:(neg?-n:n);
}
function toISO(v){
  if(typeof v==="number"&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*86400000));return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0")}
  const s=String(v??"").trim();
  let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){let y=+m[3];if(y<100)y+=2000;const mo=+m[2],d=+m[1];if(mo<1||mo>12||d<1||d>31)return null;return y+"-"+String(mo).padStart(2,"0")+"-"+String(d).padStart(2,"0")}
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[1]+"-"+m[2]+"-"+m[3];
  return null;
}
function sigOf(cols,flow){return "f"+hash(cols.map(norm).join("|")+"|"+flow)}
function idTokens(grid,hdr){
  const out=new Set(),cnt={};const rows=Math.min(grid.length,hdr+600);
  const scan=(txt,pre)=>{const u=String(txt||"").toUpperCase();
    for(const m of u.replace(/\s+/g,"").matchAll(/IT\d{2}[A-Z]\d{10}[0-9A-Z]{12}/g)){const k="iban "+m[0].slice(-8);if(pre)out.add(k);else cnt[k]=(cnt[k]||0)+1}
    for(const m of u.matchAll(/(?:\*{2,}|X{3,}|•{2,})\s?(\d{4})\b/g)){const k="carta "+m[1];if(pre)out.add(k);else cnt[k]=(cnt[k]||0)+1}};
  for(let r=0;r<rows;r++){const pre=r<hdr;for(const c of (grid[r]||[])) scan(c,pre)}
  const n=Math.max(rows-hdr-1,1);
  for(const [k,v] of Object.entries(cnt)){if(k.startsWith("carta")?(v>=3||v/n>=0.3):v/n>=0.5) out.add(k)}
  return [...out].slice(0,6);
}

async function handleFile(file){
  if(!file) return;
  try{
    const grids=await readGrids(file);
    let grid=null,found=null;
    for(const g of grids){const f=findHeader(g);if(f){grid=g;found=f;break}}
    if(!grid){
      grid=grids.find(g=>g.length>1)||grids[0]||[];
      const r=grid.findIndex(row=>(row||[]).filter(c=>String(c).trim()).length>=3);
      found={hdr:Math.max(r,0),map:{d:-1,x1:-1,x2:-1,x3:-1,a:-1,deb:-1,cre:-1}};
    }
    const cols=(grid[found.hdr]||[]).map((c,i)=>String(c).trim()||("Colonna "+(i+1)));
    const toks=idTokens(grid,found.hdr),acc=S.settings.accounts||{},at=S.settings.acctok||{};
    const pre=grid.slice(0,found.hdr).map(r=>(r||[]).map(c=>String(c??"")).join(" "));
    let holder=null;for(const l of pre){const m=l.match(/rapporto:\s*IT\w+\s*-\s*(.+)/i);if(m){holder=m[1].trim();break}}
    let conto=conti()[S.impAcc]?S.impAcc:null,payer=null,payerBy="";
    const tokOk=(t,id)=>conti()[id]&&(t.startsWith("carta ")?conti()[id].t==="carta":conti()[id].t!=="carta");
    for(const t of toks) if(at[t]&&tokOk(t,at[t])){if(at[t]!==conto){conto=at[t];payerBy="Conto riconosciuto dal file: "+conti()[conto].n}break}
    if(!conto){toast("Scegli prima il conto da cui arriva l’estratto.");return}
    const flow=conti()[conto].t||"cc";
    const sig=sigOf(cols,flow);
    const saved=S.settings.formats&&S.settings.formats[sig];
    if(conti()[conto].pb&&payerOpts().includes(conti()[conto].pb)) payer=conti()[conto].pb;
    if(!payer) for(const t of toks) if(acc[t]&&payerOpts().includes(acc[t])){payer=acc[t];payerBy=t.startsWith("iban")?"Riconosciuto dall’IBAN nel file":"Riconosciuto dal numero di carta";break}
    if(!payer&&saved&&saved.pb&&payerOpts().includes(saved.pb)){payer=saved.pb;payerBy="Come l’ultimo file con questo formato"}
    if(!payer) payer=devPayer();
    S.imp={fileName:file.name,grid,hdr:found.hdr,cols,sig,flow,acc:conto,holder,pre,payer,payerBy,toks,sort:"importo",map:saved?{d:saved.d,bal:saved.bal??found.map.bal??-1,x1:saved.x1,x2:saved.x2,x3:saved.x3??-1,a:saved.a,deb:saved.deb,cre:saved.cre}:found.map,
      invert:saved?!!saved.inv:false,person:members()[0],edits:{},rows:[],ai:null,remembered:!!saved,showMap:!saved&&(found.map.d<0)};
    // un formato salvato senza descrizione (prima che riconoscessi queste colonne) prende quelle trovate ora
    if(S.imp.map.x1<0&&found.map.x1>=0){S.imp.map.x1=found.map.x1;S.imp.map.x2=found.map.x2;S.imp.map.x3=found.map.x3??-1}
    if(S.imp.map.x1<0) S.imp.showMap=true;
    if(!saved&&flow==="carta"&&S.imp.map.a>=0){
      let pos=0,tot=0;const xi=S.imp.map.x1;
      for(let r=found.hdr+1;r<grid.length;r++){const row=grid[r]||[];const n=num(row[S.imp.map.a]);if(isNaN(n)||n===0)continue;const dsc=norm(xi>=0?row[xi]:"");if(RE_SALDO.test(dsc)||RE_GIRO.test(dsc)||RE_STORNO.test(dsc))continue;tot++;if(n>0)pos++}
      if(tot>=(flow==="carta"?2:3)&&pos/tot>(flow==="carta"?0.5:0.75)) S.imp.invert=true;
    }
    buildRows();
    S.view="imp";render();
  }catch(e){toast(e.message||"Non riesco a leggere il file.")}
}
// Saldi riportati dalla banca: in testata ("Saldo Contabile: 4.450,29 EUR A Credito") o colonna riga per riga ("Disponibile")
function bankBal(I){
  const out=[],g=I.grid,mp=I.map,bi=mp.bal!=null&&mp.bal>=0?mp.bal:-1;
  const rows=[];for(let r=I.hdr+1;r<g.length;r++){const row=g[r]||[];const d=toISO(row[mp.d]);if(d)rows.push({d,b:bi>=0?num(row[bi]):NaN})}
  if(!rows.length) return out;
  const ds=rows.map(x=>x.d),min=ds.reduce((a,b)=>a<b?a:b),max=ds.reduce((a,b)=>a>b?a:b);
  for(const l of I.pre||[]){const m=l.match(/saldo contabile:\s*(-?[\d.,]+)\s*eur\w*(?:\s*a\s*(credito|debito))?/i);if(m){const v=num(m[1]);if(!isNaN(v))out.push({d:max,v:/debito/i.test(m[2]||"")?-Math.abs(v):v});break}}
  if(bi>=0){
    const desc=rows[0].d>=rows[rows.length-1].d,endOf=d=>{const list=rows.filter(x=>x.d===d&&!isNaN(x.b));return list.length?(desc?list[0]:list[list.length-1]).b:NaN};
    for(const d of [min,max]){const v=endOf(d);if(!isNaN(v)&&!out.some(o=>o.d===d))out.push({d,v:Math.round(v*100)/100})}
  }
  return out;
}
function buildRows(){
  const I=S.imp,g=I.grid,mp=I.map,out=[],seen={};
  if(mp.d<0||(mp.a<0&&mp.deb<0&&mp.cre<0)){I.rows=[];return}
  for(let r=I.hdr+1;r<g.length;r++){
    const row=g[r]||[];const d=toISO(row[mp.d]);if(!d) continue;
    // più colonne di descrizione: tolgo i doppioni (BBVA ripete "Movimento" in "Osservazioni")
    const parts=[];
    for(const i of [mp.x1,mp.x2,mp.x3]){if(i==null||i<0)continue;const v=cleanDesc(row[i]);if(!v||/^\d{1,4}$/.test(v))continue;const nv=norm(v);
      if(parts.some(q=>norm(q.v).includes(nv)))continue;for(let j=parts.length-1;j>=0;j--)if(nv.includes(norm(parts[j].v)))parts.splice(j,1);parts.push({i,v})}
    const desc=parts.map(q=>q.v).join(" · ");
    // il nome dell'esercente non viene dalla colonna del tipo di operazione ("Bonifico eseguito"), se c'è altro
    const named=parts.filter(q=>!COLRE.xt.test(norm(I.cols[q.i]||"")));
    const mdesc=(named.length?named:parts).map(q=>q.v).join(" ");
    let a;
    if(mp.a>=0) a=num(row[mp.a]);
    else{const de=mp.deb>=0?num(row[mp.deb]):NaN,cr=mp.cre>=0?num(row[mp.cre]):NaN;a=(isNaN(de)&&isNaN(cr))?NaN:(isNaN(cr)?0:Math.abs(cr))-(isNaN(de)?0:Math.abs(de))}
    if(isNaN(a)||a===0) continue;
    if(I.invert&&mp.a>=0) a=-a;
    a=Math.round(a*100)/100;
    const base=d+"|"+a+"|"+norm(desc)+"|"+FLOWS[I.flow];seen[base]=(seen[base]||0)+1;
    const rk=base+"|"+seen[base];
    const id="b"+hash(rk+"|"+I.payer);
    let k=detectKind(desc,a,I.flow),gw=null;
    if(I.flow==="cc"&&k==="spesa"&&a<0){const w=cardCharge(d,a);if(w){k="giroconto";gw="Addebito carta: "+w}}
    if(!gw&&I.flow!=="carta"&&(k==="spesa"||k==="entrata")){const w=ownTransfer(d,a,I.acc,I.flow);if(w){k="giroconto";gw="Trasferimento tra i vostri conti: "+w}}
    if(!gw&&I.flow!=="carta"&&(k==="spesa"||k==="entrata")){const w=ownName(extractMerchant(mdesc),I.holder);if(w){k="giroconto";gw="Bonifico con un vostro conto: "+titleCase(w)}}
    const tx={id,rk,d,a,x:desc,m:extractMerchant(mdesc),k,s:FLOWS[I.flow],acc:I.acc||undefined,p:I.person,pb:I.payer,c:k==="spesa"?"":null,cb:null,f:null,gw};
    if(k==="spesa"){const ac=autoCat(tx);if(ac){tx.c=ac.c;if(ac.p)tx.p=ac.p;tx.cb=ac.by}}
    const e=I.edits[rk];if(e)Object.assign(tx,e);
    tx.dup=!!S.byId[id];
    out.push(tx);
  }
  out.sort(I.sort==="data"?(x,y)=>y.d.localeCompare(x.d):(x,y)=>((x.k==="spesa"?0:1)-(y.k==="spesa"?0:1))||Math.abs(y.a)-Math.abs(x.a)||y.d.localeCompare(x.d));
  I.rows=out;
}

async function callClaude(prompt){

      headers:{"content-type":"application/json","x-api-key":apiKey(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:apiModel(),max_tokens:4096,messages,
        tools:[{type:"web_search_20250305",name:"web_search",max_uses:12,user_location:{type:"approximate",city:"Treviso",region:"Veneto",country:"IT",timezone:"Europe/Rome"}}]})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){const err=new Error((j.error&&j.error.message)||("HTTP "+r.status));err.status=r.status;throw err}
    const ws=j.usage&&j.usage.server_tool_use&&j.usage.server_tool_use.web_search_requests;
    if(S.imp&&ws) S.imp.searches=(S.imp.searches||0)+ws;
    if(j.stop_reason==="pause_turn"){messages=[...messages,{role:"assistant",content:j.content}];continue}
    const blocks=j.content||[];
    let last=-1;blocks.forEach((b,i)=>{if(b.type==="web_search_tool_result")last=i});

  }

}

    else if(e.status===429) toast("Troppe richieste ravvicinate: riprova tra un minuto.");
    else if(e.status===400&&/credit|balance/i.test(e.message)) toast("Credito API esaurito: ricaricalo dalla Console Anthropic.");
    else if(e.status===400&&/web.?search/i.test(e.message)) toast("Ricerca web non abilitata: attivala nella Console Anthropic.");
    else if(e.json||e instanceof SyntaxError) toast("Risposta non leggibile: riprova.");
    else toast("Riconoscimento interrotto: "+(e.message||"errore"));
  }finally{I.ai=null;buildRows();render()}
}

async function saveImport(){
  const I=S.imp;if(!I) return;
  const rows=I.rows.filter(r=>!r.dup);
  if(!rows.length){toast("Nessun movimento nuovo da salvare.");return}
  const now=Date.now();
  const list=rows.map((r,i)=>({...r,rk:undefined,dup:undefined,gw:undefined,c:r.k==="spesa"?(r.c||"altro"):null,by:S.uid||undefined,t:now+i}));
  const learn={};
  for(const [rk,e] of Object.entries(I.edits)) if(e.cb==="manuale"&&e.c){const r=I.rows.find(x=>x.rk===rk);if(r) learn[mkey(r.m)]={c:e.c}}
  const btn=$("#saveImp");if(btn)btn.disabled=true;
  try{
    await putTx(list);
    // l'altro lato di un trasferimento, importato prima da un altro conto, diventa anche lui giroconto
    const fix=[];
    for(const r of list) if(r.k==="giroconto"&&r.acc){const o=counterpart(r);if(o&&o.acc&&(o.k==="spesa"||o.k==="entrata")&&o.cb!=="manuale"&&!fix.includes(o))fix.push(o)}
    if(fix.length) await putTx(fix.map(o=>({...o,k:"giroconto",c:null})));
    const patch={formats:{[I.sig]:{d:I.map.d,bal:I.map.bal??-1,x1:I.map.x1,x2:I.map.x2,x3:I.map.x3??-1,a:I.map.a,deb:I.map.deb,cre:I.map.cre,inv:I.invert,pb:I.payer}}};
    if(Object.keys(learn).length) patch.rules=learn;
    // intestatario e saldi della banca sul conto, per la verifica dei saldi
    if(I.acc&&conti()[I.acc]){
      const c=conti()[I.acc],bk=bankBal(I),bks=[...(c.bks||[]).filter(o=>!bk.some(n=>n.d===o.d)),...bk].sort((x,y)=>x.d.localeCompare(y.d)).slice(-12);
      const latest=bks[bks.length-1];
      patch.conti={[I.acc]:{...c,...(I.holder&&!c.holder?{holder:I.holder}:{}),bks,...(!c.bal&&latest?{bal:{...latest,src:"banca"}}:{})}};
    }
    if(I.toks&&I.toks.length){patch.accounts={};patch.acctok={};for(const t of I.toks){if(t.startsWith("carta ")!==(I.flow==="carta"))continue;patch.accounts[t]=I.payer;if(I.acc)patch.acctok[t]=I.acc}}
    await saveSettings(patch);
    const latest=list.map(t=>t.d).sort().pop();
    S.imp=null;showMonth(ymOf(latest));S.view="movs";render();
    toast("Salvati "+list.length+" movimenti");
  }catch(e){toast(errMsg(e));if(btn)btn.disabled=false}
}

// Colonne impilate per mese: le 6 categorie principali, il resto in "Altre categorie"
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x||1)));const m=x/p;return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p}
function eurShort(n){return n>=1000?(n/1000).toLocaleString("it-IT",{maximumFractionDigits:1})+"k":String(Math.round(n))}
function vChart(){
  S.chart=null;
  const pm=perMonths(),ms=pm.length>1?pm:Array.from({length:6},(_,i)=>shiftYM(S.per.to,i-5));
  const sp=spOf(S.all.filter(t=>{const ym=ymOf(t.d);return ym>=ms[0]&&ym<=ms[ms.length-1]}));
  if(!sp.length) return "";
  const tot={};sp.forEach(t=>{const c=t.c||"altro";tot[c]=(tot[c]||0)-t.a});
  const ranked=Object.entries(tot).filter(([,v])=>v>0.004).sort((a,b)=>b[1]-a[1]).map(([c])=>c);
  const fold=ranked.length>7,keys=fold?[...ranked.filter(c=>c!=="altro").slice(0,6),"_rest"]:ranked;
  const color=k=>k==="_rest"?"var(--muted)":(CAT[k]||CAT.altro).c;
  const name=k=>k==="_rest"?"Altre categorie":(CAT[k]||CAT.altro).n;
  const cols=ms.map(ym=>{const seg={};let t=0;for(const x of sp) if(ymOf(x.d)===ym){const c=x.c||"altro",k=keys.includes(c)?c:"_rest";seg[k]=(seg[k]||0)-x.a;t-=x.a}
    return {ym,seg,t,pos:keys.reduce((s,k)=>s+Math.max(seg[k]||0,0),0)}});
  const bud=budgetOn()?monthBudget():0;
  const max=Math.max(...cols.map(c=>c.pos),bud,1),step=niceStep(max/4),top=Math.ceil(max/step)*step;
  const ticks=[];for(let v=0;v<=top+0.001;v+=step)ticks.push(v);
  const every=ms.length>12?Math.ceil(ms.length/8):1;
  S.chart={cols,keys,color,name,bud};
  const ctx=pm.length===1;
  return `<section class="block"><div class="bh"><h2>Mese per mese</h2>${ctx?`<span class="hint">ultimi 6 mesi</span>`:""}</div>
  <div class="chart" id="chart">
    <div class="plot">
      ${ticks.map(v=>`<div class="gl" style="bottom:${v/top*100}%"><span class="num">${eurShort(v)}</span></div>`).join("")}
      ${bud>0?`<div class="bl" style="bottom:${bud/top*100}%"><span>budget ${eurShort(bud)}</span></div>`:""}
      <div class="cols">${cols.map((c,i)=>`<button class="col ${ctx&&c.ym!==S.per.to?"dim":""}" data-col="${i}" aria-label="${h(ymLabel(c.ym))}: ${h(eur(c.t))}"><span class="stack" style="height:${c.pos/top*100}%">${keys.map(k=>(c.seg[k]||0)>0?`<i style="flex:${c.seg[k]};background:${color(k)}"></i>`:"").join("")}</span></button>`).join("")}</div>
    </div>
    <div class="xl" aria-hidden="true">${cols.map((c,i)=>`<span>${i%every===0?h(monShort(c.ym)+(c.ym.endsWith("-01")||i===0?" "+c.ym.slice(2,4):"")):""}</span>`).join("")}</div>
    <div class="ctip" id="ctip" hidden></div>

// Controparte di un bonifico tra i vostri conti: stesso importo di segno opposto, entro 6 giorni (festività)
function counterpart(t){
  if(isVincolo(norm((t.x||"")+" "+(t.m||"")))||isCardText(t)) return null;
  for(const o of S.all){
    if(o===t||(t.acc&&o.acc===t.acc)) continue;
    if(o.s===FLOWS.carta||o.s===CASH||o.k==="prelievo") continue;
    if(isVincolo(norm((o.x||"")+" "+(o.m||"")))) continue;
    if(Math.abs(o.a+t.a)<0.01&&dayDiff(o.d,t.d)<=6) return o;
  }
  return null;
}
// Pagina personale: soldi spostati verso conti comuni e altri conti vostri, raggruppati per destinazione
function jointFlows(tx){
  const groups={};
  for(const t of tx){
    if(t.k!=="giroconto"||t.s===FLOWS.carta) continue;
    if(isCardText(t)||isVincolo(norm((t.x||"")+" "+(t.m||"")))) continue;
    const c=counterpart(t),ca=c&&conti()[c.acc];
    if(ca&&ca.pb===S.page) continue;
    const name=ca?ca.n:(ownName(t.m||"")?"Altri conti vostri":"Altri giroconti");
    const g=groups[name]=groups[name]||{name,joint:!!(ca&&ca.pb===JOINT),out:0,in:0};
    if(t.a<0) g.out-=t.a; else g.in+=t.a;
  }
  const list=Object.values(groups).sort((a,b)=>(b.joint-a.joint)||(b.out-a.out));
  return {groups:list,net:list.filter(g=>g.joint).reduce((x,g)=>x+g.out-g.in,0)};
}
function vJoint(J){
  if(!J.groups.length) return "";
  return `<section class="block"><h2>Conti comuni e giroconti</h2>
    <p class="hint">Non sono spese: soldi spostati tra i vostri conti ${h(perIn())}.</p>
    <div class="recon num"><span class="h">Conto</span><span class="h">Versato</span><span class="h">Ricevuto</span></div>
    ${J.groups.map(g=>`<div class="recon num"><span>${h(g.name)}${g.joint?` <span class="hint" style="margin:0">· comune</span>`:""}</span><span>${eur(g.out)}</span><span>${eur(g.in)}</span></div>`).join("")}
    ${J.groups.some(g=>g.joint)?`<label class="check"><input type="checkbox" id="inclgiro" ${S.inclGiro?"checked":""}><span>Conta tra le uscite il netto versato ai conti comuni: ${eur(J.net)}</span></label>`:`<div style="height:10px"></div>`}
  </section>`;
}

// Saldi: un saldo noto (dalla banca o inserito a mano) e i movimenti importati danno il saldo a ogni data
function periodEnd(){const e=S.per.to+"-"+String(lastDay(S.per.to)).padStart(2,"0");return e<today()?e:today()}
function rollFrom(anchor,list,date,delta){
  let v=anchor.v;
  for(const t of list){const x=delta(t);if(!x)continue;if(date>=anchor.d){if(t.d>anchor.d&&t.d<=date)v+=x}else if(t.d>date&&t.d<=anchor.d)v-=x}
  return Math.round(v*100)/100;
}
function accTx(id){return S.all.filter(t=>t.acc===id)}
function balAt(id,date){const c=conti()[id];return c&&c.bal?rollFrom(c.bal,accTx(id),date,t=>t.a):null}
function isVincMove(t){const x=norm((t.x||"")+" "+(t.m||""));return /(apertura|liquidazione) (linea )?vincolat|apertura vincolo|estinzione vincolo|svincolo/.test(x)&&!/interessi|bollo|imposta/.test(x)}
function vincAt(id,date){const c=conti()[id];return c&&c.vinc?rollFrom(c.vinc,accTx(id),date,t=>isVincMove(t)?-t.a:0):null}
// Carta: spese dopo l'ultimo estratto già addebitato
function cardDebt(id,date){
  let E=null;for(const t of ccOut()) if(isCardText(t)&&t.d<=date){const e=stmtOf(t);if(!E||e>E)E=e}
  const from=E?cycleEnd(E,cardCut()):"0000-00-00";
  return -sum(cardTx().filter(t=>t.acc===id&&t.d>from&&t.d<=date));
}
function bankCheck(id){
  const c=conti()[id];if(!c||!c.bal||!c.bks||!c.bks.length) return null;
  const res=c.bks.map(b=>({d:b.d,bank:b.v,calc:balAt(id,b.d)})).map(r=>({...r,diff:Math.round((r.calc-r.bank)*100)/100}));
  const bad=res.filter(r=>Math.abs(r.diff)>0.01);
  return {res,bad,last:res[res.length-1]};
}
function vSaldi(){
  const list=contoList().filter(([,v])=>isFam()||v.pb===S.page);if(!list.length) return "";
  const P=periodEnd();let liq=0,vin=0,lib=0,debt=0,miss=0;
  const rows=list.map(([id,v])=>{
    if(v.t==="carta"){const dbt=cardDebt(id,P);debt+=dbt;return `<div class="recon num"><span>${h(v.n)}</span><span>da addebitare</span><span>−${eur(dbt)}</span></div>`}
    const b=balAt(id,P),chk=bankCheck(id),vi=vincAt(id,P);
    if(b==null) miss++; else liq+=b;
    if(vi!=null) vin+=vi;
    if(v.lib&&v.lib.v) lib+=v.lib.v;
    const st=b==null?`<span class="ko">saldo da impostare</span>`:!chk?`<span class="hint" style="margin:0">nessun saldo della banca</span>`:chk.bad.length?`<span class="ko">non torna: ${chk.bad.map(r=>(r.diff>0?"+":"−")+eur(Math.abs(r.diff))+" al "+ddmm(r.d)).join(", ")}</span>`:`<span class="ok">torna con la banca al ${ddmm(chk.last.d)}</span>`;
    return `<div class="recon num"><span>${h(v.n)}</span><span>${st}</span><span>${b==null?"—":eur(b)}</span></div>
      ${vi!=null?`<div class="recon num"><span class="hint" style="margin:0">${h(v.n)} · vincolato</span><span></span><span>${eur(vi)}</span></div>`:""}
      ${v.lib&&v.lib.v?`<div class="recon num"><span class="hint" style="margin:0">${h(v.n)} · linea libera (inserita il ${ddmm(v.lib.d)})</span><span></span><span>${eur(v.lib.v)}</span></div>`:""}`;
  }).join("");
  const tot=liq+vin+lib;
  return `<section class="block"><div class="bh"><h2>Conti e saldi al ${ddmm(P)}</h2><button class="link" data-act="settings">Imposta saldi</button></div>
    <div class="recon num"><span class="h">Conto</span><span class="h">Verifica</span><span class="h">Saldo</span></div>
    ${rows}

}

// Confronto tra addebiti della carta sul conto e spese dell'estratto carta del mese prima
function vCardCheck(){
  const hasCard=S.all.some(t=>t.s===FLOWS.carta);
  const cut=cardCut();
  // una riga per estratto carta: l'addebito può arrivare il mese dopo o anche più tardi
  const all=[];for(let ym=S.per.from;ym<=shiftYM(S.per.to,3);ym=shiftYM(ym,1)) all.push(...cardCharges(ym).filter(inPage));
  // nella pagina personale contano solo le carte di quella persona
  const A=pageAccs(),myCards=contoList().filter(([k,v])=>v.t==="carta"&&(!A||A.has(k))).map(([k])=>k);
  const spentE=E=>A?myCards.reduce((x,k)=>x+cardSpent(E,cut,k),0):cardSpent(E,cut);
  const rows=perMonths().map(m=>shiftYM(m,-1)).map(E=>{
    const list=all.filter(t=>stmtOf(t)===E),[from,to]=cardRange(E,cut);
    // dettaglio per carta, quando il numero finale nell'addebito corrisponde a un conto carta
    // senza numero associato, provo il conto carta le cui spese del ciclo coincidono con l'addebito
    const cardAccs=myCards;
    const cards=list.map(t=>{const l4=cardLast4(t),E=stmtOf(t);let acc=cardContoOf(l4);
      if(!acc) acc=cardAccs.find(k=>Math.abs(cardSpent(E,cut,k)+t.a)<=1)||null;
      return {t,l4,acc,sp:acc?cardSpent(E,cut,acc):null}});
    return {E,list,cards,from,to,ch:-sum(list),sp:spentE(E)};
  }).filter(r=>r.ch>0.004||r.sp>0.004);
  const sus=perTx().filter(inPage).filter(t=>t.s!==FLOWS.carta&&t.s!==CASH&&(t.k==="spesa"||t.k==="entrata")).map(t=>{
    const v=isVincolo(norm(t.x+" "+t.m));
    const c=!v&&t.s===FLOWS.cc&&t.k==="spesa"&&t.a<0?cardCharge(t.d,t.a):null;
    const w=v||c?null:ownTransfer(t.d,t.a,t.acc,flowOf(t));
    const o=v||c||w?null:ownName(t.m||"");
    return {t,why:v?(t.a<0?"Vincolo: soldi spostati sul conto vincolato":"Vincolo: capitale restituito alla scadenza"):c?"Addebito carta: "+c:w?"Trasferimento tra i vostri conti: "+w:o?"Bonifico con un vostro conto: "+titleCase(o):null};
  }).filter(x=>x.why);
  if(!rows.length&&!sus.length) return "";
  return `<section class="block"><h2>Carta di credito e trasferimenti</h2>
    ${sus.length?`<p class="banner">Questi movimenti sembrano l’addebito della carta, un vincolo o uno spostamento tra i vostri conti, ma contano come spesa o entrata. Così verrebbero contati due volte.</p>
      ${sus.map(({t,why})=>`<div class="rules" style="margin-bottom:8px"><div><span><b>${h(t.m)}</b> · ${ddmm(t.d)}<br><span class="hint">${h(why)}</span></span><span class="num" style="white-space:nowrap">${t.a>0?"+":"−"}${eur(Math.abs(t.a))}</span></div><div><span class="hint" style="margin:0">${h(srcName(t))}</span><button class="link" data-act="mkgiro" data-id="${h(t.id)}" ${S.canWrite?"":"disabled"}>Segna come giroconto</button></div></div>`).join("")}`:""}
    ${rows.length?`<div class="recon num"><span class="h">Estratto · addebitato sul conto</span><span class="h">Spese carta del ciclo</span><span class="h">Esito</span></div>
      ${rows.map(r=>{const d=r.ch-r.sp,ok=Math.abs(d)<=1,miss=!r.list.length;return `<details class="rrow"><summary class="recon num">
        <span>${h(monthName(r.E))} · ${miss?"—":eur(r.ch)}</span><span>${eur(r.sp)}</span><span class="${ok?"ok":"ko"}">${ok?"Torna":miss?"Addebito non trovato":(d>0?"+":"−")+eur(Math.abs(d))}</span></summary>
        <div class="hint">Estratto di ${h(ymLabel(r.E))}: spese carta dal ${ddmm(nextDay(r.from))} al ${ddmm(r.to)}, al netto dei rimborsi. Sotto, gli addebiti sul conto per questo estratto.</div>
        ${r.list.length?r.cards.map(({t,l4,acc,sp})=>{const dd=sp==null?null:-t.a-sp;return `<button class="tx" data-act="edit" data-id="${h(t.id)}"><span class="m">${l4?"Carta …"+h(l4)+(acc?" · "+h(conti()[acc].n):""):h(t.m||t.x)}</span><span class="a num">−${eur(-t.a)}</span><span class="meta"><span>${h(srcName(t))}</span><span class="num">${ddmm(t.d)}</span>${sp!=null?`<span>spese della carta ${eur(sp)}</span><span class="${Math.abs(dd)<=1?"":"flag"}">${Math.abs(dd)<=1?"torna":(dd>0?"+":"−")+eur(Math.abs(dd))}</span>`:l4?`<span>importa l’estratto di questa carta per il confronto separato</span>`:""}</span></button>`}).join(""):`<div class="hint">Nessun addebito trovato per l’estratto di ${h(monthName(r.E))}. Se l’addebito non è ancora arrivato è normale; altrimenti aprilo da Movimenti e controlla la descrizione.</div>`}
      </details>`}).join("")}
    <p class="hint" style="padding-bottom:10px">${hasCard?`Ogni riga è un estratto della carta. Toccala per vedere gli addebiti contati, carta per carta. L’estratto carta chiude ${cut?cut+(cut===1?" giorno":" giorni")+" prima della fine del mese":"l’ultimo giorno del mese"}${cut===2?"":" (stimato dai vostri dati)"}. L’addebito sul conto non conta come spesa: contano le singole spese della carta.`:"Importa anche l’estratto della carta per confrontarlo con l’addebito sul conto."}</p>`:""}
  </section>`;
}

function txRow(t,showDate){

  return `<button class="tx" data-act="edit" data-id="${h(t.id)}">
    <span class="m">${h(t.m||t.x||"Movimento")}</span><span class="a num ${amtCls}">${sign}${eur(Math.abs(t.a))}</span>
    <span class="meta">${k==="spesa"?`<span class="tag">${catDot(t.c)}${h((CAT[t.c]||CAT.altro).n)}</span>`:`<span class="tag">${h(KINDS[k])}</span>`}
      ${k==="spesa"&&t.p?`<span>per ${h(t.p)}</span>`:""}${t.pb&&(k==="spesa"||k==="prelievo")?`<span>${k==="prelievo"?"prelevati da":"pagata da"} ${h(t.pb)}</span>`:""}<span>${h(t.s===CASH?"contanti":srcName(t))}</span>${showDate?`<span class="num">${ddmm(t.d)}</span>`:""}${low?`<span class="flag">da verificare</span>`:""}</span>
  </button>`;
}
function vMovs(){
  const f=S.f,q=norm(f.q);
  let list=(q?S.all:perTx()).filter(inPage);
  if(q) list=list.filter(t=>norm(t.m+" "+t.x+" "+(t.n||"")).includes(q));
  if(f.c) list=list.filter(t=>t.k==="spesa"&&(t.c||"altro")===f.c);
  if(f.p) list=list.filter(t=>t.p===f.p);
  if(f.s) list=list.filter(t=>srcName(t)===f.s);
  if(f.pb) list=list.filter(t=>t.pb===f.pb);
  const byVal=S.msort==="importo";
  if(byVal) list=[...list].sort((x,y)=>((x.k==="spesa"?0:1)-(y.k==="spesa"?0:1))||Math.abs(y.a)-Math.abs(x.a)||y.d.localeCompare(x.d));
  const spent=-sum(list.filter(t=>t.k==="spesa"));
  let html=`${pageSeg()}<div class="filters">
    <input type="search" id="fq" placeholder="Cerca esercente o descrizione" value="${h(f.q)}" aria-label="Cerca">
    <select id="fc" aria-label="Categoria"><option value="">Tutte le categorie</option>${CATS.map(([id,n])=>`<option value="${id}" ${f.c===id?"selected":""}>${h(n)}</option>`).join("")}</select>
    <select id="fp" aria-label="Beneficiario"><option value="">Ogni beneficiario</option>${members().map(m=>`<option ${f.p===m?"selected":""}>${h(m)}</option>`).join("")}</select>
    <select id="fpb" aria-label="Sostenuta da"><option value="">Chiunque abbia pagato</option>${payerOpts().map(m=>`<option ${f.pb===m?"selected":""}>${h(m)}</option>`).join("")}</select>
    <select id="fs" aria-label="Mezzo"><option value="">Ogni mezzo</option>${sources().map(m=>`<option ${f.s===m?"selected":""}>${h(m)}</option>`).join("")}</select>
  </div>
  <div class="toolbar"><div class="seg sm" role="group" aria-label="Ordina"><button data-act="msort" data-s="data" aria-pressed="${!byVal}">Per data</button><button data-act="msort" data-s="importo" aria-pressed="${byVal}">Per importo</button></div><span class="hint num" style="margin:0">${list.length} movimenti${q?" in tutti i mesi":""} · spese ${eur(spent)}</span></div>`;
  if(!list.length) return html+`<p class="hint" style="margin-top:20px">Nessun movimento con questi filtri.${(f.c||f.p||f.s||f.q||f.pb)?` <button class="link" data-act="clearf">Togli i filtri</button>`:""}</p>`;
  let cur="";
  if(byVal) return html+list.map(t=>txRow(t,true)).join("");
  for(const t of list){
    if(t.d!==cur){cur=t.d;const [y,m,d]=t.d.split("-").map(Number);html+=`<div class="day">${h(new Date(y,m-1,d).toLocaleDateString("it-IT",{weekday:"short",day:"numeric",month:"long",year:q||S.per.from.slice(0,4)!==S.per.to.slice(0,4)?"numeric":undefined}))}</div>`}
    html+=txRow(t);
  }
  return html;
}

async function saveEdit(){
  const t=S.byId[S.sheet.id];if(!t) return;
  const a=num($("#ea").value);if(isNaN(a)||a===0){toast("Inserisci un importo valido.");return}
  const k=$("#ek").value;
  const nt={...t,m:$("#em").value.trim()||t.m,d:$("#ed").value||t.d,k,c:k==="spesa"?$("#ec").value:null,p:$("#ep").value,pb:$("#epb").value,...(conti()[$("#es").value]?{acc:$("#es").value,s:FLOWS[conti()[$("#es").value].t]||FLOWS.cc}:{acc:"",s:$("#es").value}),n:$("#en").value.trim(),cb:"manuale",f:null};
  nt.a=(k==="entrata")?Math.abs(a):(t.a>0&&k==="spesa"?Math.abs(a):-Math.abs(a));

    if(ymOf(nt.d)!==ymOf(t.d)) await delTx(t);

async function exportCSV(scope){
  let list=S.all;
  if(scope==="per") list=perTx(); else if(scope==="year") list=S.all.filter(t=>t.d.startsWith(S.per.to.slice(0,4)));
  if(!list.length){toast("Nessun movimento da esportare.");return}
  const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const lines=["Data;Esercente;Descrizione;Tipo;Categoria;Beneficiario;Sostenuta da;Mezzo;Nota;Importo"];
  for(const t of [...list].reverse()) lines.push([t.d.split("-").reverse().join("/"),t.m,t.x,KINDS[t.k||"spesa"],t.k==="spesa"?(CAT[t.c]||CAT.altro).n:"",t.p,t.pb,t.s,t.n,String(t.a.toFixed(2)).replace(".",",")].map(q).join(";"));
  const data="\uFEFF"+lines.join("\r\n");
  const name="spese-famiglia-"+(scope==="per"?(S.per.from===S.per.to?S.per.from:S.per.from+"_"+S.per.to):scope==="year"?S.per.to.slice(0,4):"tutto")+".csv";
  const url=URL.createObjectURL(new Blob([data],{type:"text/csv;charset=utf-8"}));
  const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
}

  else if(act==="ck"){S.cash.k=el.dataset.k;render()}
  else if(act==="cc"){S.cash.c=el.dataset.c;render()}

  else if(act==="filterpb"){S.f={q:"",c:S.hf.c,p:S.hf.p,s:"",pb:el.dataset.p};S.view="movs";render();window.scrollTo(0,0)}

  }
  else if(act==="clearconto"){

    try{await delTxList(list);S.confirmClear=null;toast("Eliminati "+list.length+" movimenti");openSettings()}catch(err){toast(errMsg(err));el.disabled=false}
  }
  else if(act==="delconto"){const id=el.dataset.k;try{await saveSettings({conti:{[id]:null}});const c={...conti()};delete c[id];S.settings.conti=c;openSettings()}catch(err){toast(errMsg(err))}}
  else if(act==="assignleg"){
    const src=el.dataset.s,target=$("#lg_"+el.dataset.i).value;if(!conti()[target])return;

  }
  else if(act==="addcat"){
    const n=$("#ncat").value.trim();if(!n){toast("Scrivi il nome della categoria.");$("#ncat").focus();return}
    if(CATS.some(([,x])=>norm(x)===norm(n))){toast("Esiste già una categoria con questo nome.");return}
    const used=new Set(CATS.map(c=>c[2])),c=EXTRA_COLORS.find(x=>!used.has(x))||EXTRA_COLORS[CATS.length%EXTRA_COLORS.length];
    const id="u"+hash(norm(n)).slice(0,8);
    try{await saveSettings({cats:{[id]:{n,c}}});S.settings.cats={...(S.settings.cats||{}),[id]:{n,c}};rebuildCats();toast("Categoria aggiunta");openSettings()}catch(err){toast(errMsg(err))}
  }
  else if(act==="delcat"){const id=el.dataset.k;try{await saveSettings({cats:{[id]:null}});const c={...(S.settings.cats||{})};delete c[id];S.settings.cats=c;rebuildCats();openSettings()}catch(err){toast(errMsg(err))}}
  else if(act==="savecash"){
    const C=S.cash;C.a=$("#ca").value;if($("#cw"))C.w=$("#cw").value;C.d=$("#cd").value||today();
    const a=num(C.a);
    if(isNaN(a)||a<=0){toast("Inserisci l’importo.");$("#ca").focus();return}
    if(C.k==="spesa"&&!C.c){toast("Scegli una categoria.");return}
    const t=C.k==="spesa"
      ?{id:uid(),d:C.d,a:-Math.abs(a),m:C.w.trim()||CAT[C.c].n,x:"Contanti",c:C.c,p:C.p,pb:C.pb,s:CASH,k:"spesa",by:S.uid||undefined,t:Date.now(),cb:"manuale"}
      :{id:uid(),d:C.d,a:-Math.abs(a),m:"Prelievo contanti",x:"Inserito a mano",p:members()[0],pb:C.pb,s:FLOWS.cc,k:"prelievo",by:S.uid||undefined,t:Date.now(),cb:"manuale"};
    el.disabled=true;
    try{await putTx([t]);const keepP=C.p,keepK=C.k,keepPB=C.pb;S.cash=newCash();S.cash.p=keepP;S.cash.k=keepK;S.cash.pb=keepPB;showMonth(ymOf(t.d));render();toast(t.k==="spesa"?"Spesa in contanti registrata":"Prelievo registrato")}
    catch(err){toast(errMsg(err));el.disabled=false}
  }
  else if(act==="togglemap"){S.imp.showMap=!S.imp.showMap;render()}
  else if(act==="ai") aiClassify();
  else if(act==="saveimp") saveImport();
  else if(act==="savesettings"){
    const mem=[...new Set($("#smem").value.split("\n").map(s=>s.trim()).filter(Boolean))];
    const pay=[...new Set($("#spay").value.split("\n").map(s=>s.trim()).filter(Boolean))];

    try{await saveSettings({members:mem,payers:pay});closeSheet();toast("Impostazioni salvate")}catch(err){toast(errMsg(err))}
  }
  else if(act==="delrule"){try{await saveSettings({rules:{[el.dataset.k]:null}});if(S.local)openSettings();else{el.closest("div").remove()}}catch(err){toast(errMsg(err))}}
  else if(act==="export") exportCSV(el.dataset.scope);
  else if(act==="delacc"){try{await saveSettings({accounts:{[el.dataset.k]:null}});el.closest("div").remove()}catch(err){toast(errMsg(err))}}
  else if(act==="savekey"){try{localStorage.setItem("sf-api-key",$("#skey").value.trim());localStorage.setItem("sf-model",$("#smodel").value);toast("Salvato su questo dispositivo")}catch(err){toast("Impossibile salvare su questo dispositivo.")}}
  else if(act==="logout"){closeSheet();await signOut(S.auth)}
  else if(act==="login"){
    const em=$("#le").value.trim(),pw=$("#lp").value;S.loginEmail=em;
    if(!em||!pw){S.authMsg="Inserisci email e password.";render();return}
    el.disabled=true;
    try{await signInWithEmailAndPassword(S.auth,em,pw);S.authMsg=""}
    catch(err){S.authMsg=/invalid-credential|wrong-password|user-not-found|invalid-email/.test(err.code||"")?"Email o password non corrette.":err.code==="auth/too-many-requests"?"Troppi tentativi: riprova tra qualche minuto.":"Accesso non riuscito: controlla la connessione.";el.disabled=false;$("#lp").blur();render()}
  }
  else if(act==="reset"){
    const em=$("#le").value.trim();S.loginEmail=em;
    if(!em){S.authMsg="Scrivi la tua email, poi premi di nuovo qui.";render();return}
    try{await sendPasswordResetEmail(S.auth,em);S.authMsg="Ti ho inviato un’email per impostare la password. Controlla anche lo spam."}catch(err){S.authMsg="Invio non riuscito: controlla l’indirizzo."}
    $("#le").blur();render();
  }
});
document.addEventListener("input",e=>{
  const id=e.target.id;
  if(id==="fq"){S.f.q=e.target.value;clearTimeout(S.qt);S.qt=setTimeout(()=>{const pos=e.target.selectionStart;e.target.blur();render();const n=$("#fq");if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}},350)}
  else if(id==="ca"&&S.cash) S.cash.a=e.target.value;
  else if(id==="cw"&&S.cash) S.cash.w=e.target.value;
});
document.addEventListener("change",async e=>{
  const t=e.target,id=t.id;
  if(id==="file"){handleFile(t.files[0]);t.value="";return}
  if(id==="fc"){S.f.c=t.value;t.blur();render();return}
  if(id==="fp"){S.f.p=t.value;t.blur();render();return}
  if(id==="fs"){S.f.s=t.value;t.blur();render();return}
  if(id==="fpb"){S.f.pb=t.value;t.blur();render();return}
  if(id==="hfp"||id==="hfpb"||id==="hfc"){S.hf[id.slice(2)]=t.value;t.blur();render();return}
  if(t.dataset.ct){
    const id2=t.dataset.ct,c=conti()[id2];if(!c)return;const v={...c,t:t.value};
    const upd=S.all.filter(x=>x.acc===id2&&x.s!==FLOWS[t.value]).map(x=>({...x,s:FLOWS[t.value]}));
    try{await saveSettings({conti:{[id2]:v}});S.settings.conti={...conti(),[id2]:v};if(upd.length)await putTx(upd);toast(upd.length?"Tipo cambiato. Per riclassificare i movimenti già importati, svuota il conto e reimporta":"Tipo cambiato")}catch(err){toast(errMsg(err))}
    return;
  }
  if(t.dataset.cpb){
    const id2=t.dataset.cpb,c=conti()[id2];if(!c)return;const old=c.pb,nv=t.value,v={...c,pb:nv};
    const upd=S.all.filter(x=>x.acc===id2&&x.pb===old).map(x=>({...x,pb:nv}));
    try{await saveSettings({conti:{[id2]:v}});S.settings.conti={...conti(),[id2]:v};if(upd.length)await putTx(upd);toast(upd.length?`Intestatario aggiornato anche su ${upd.length} ${upd.length===1?"movimento":"movimenti"}`:"Intestatario aggiornato")}catch(err){toast(errMsg(err))}
    return;
  }
  if(id==="inclgiro"){S.inclGiro=t.checked;render();return}
  if(id==="iacc0"){if(t.value==="__new"){S.impNew=true;S.impAcc=""}else{S.impAcc=t.value;S.impNew=false}t.blur();render();return}
  if(id==="cd"&&S.cash){S.cash.d=t.value;return}
  const I=S.imp;if(!I) return;
  if(id==="iacc"){const c=conti()[t.value];if(!c)return;I.acc=t.value;S.impAcc=t.value;I.flow=c.t||"cc";I.sig=sigOf(I.cols,I.flow);if(c.pb&&payerOpts().includes(c.pb))I.payer=c.pb;I.payerBy="";I.edits={};buildRows();t.blur();render();return}
  if(id==="ipb"){I.payer=t.value;I.payerBy="";buildRows();t.blur();render();return}
  if(t.dataset.pp){const r=I.rows.find(x=>x.id===t.dataset.pp);if(r){I.edits[r.rk]=Object.assign(I.edits[r.rk]||{},{p:t.value})}buildRows();t.blur();render();return}
  if(id==="iper"){const old=I.person;I.person=t.value;for(const e2 of Object.values(I.edits)) if(e2.p===old) delete e2.p;buildRows();t.blur();render();return}
  if(id==="inv"){I.invert=t.checked;buildRows();render();return}
  if(t.dataset.m){I.map[t.dataset.m]=Number(t.value);if(t.dataset.m==="a"&&I.map.a>=0){I.map.deb=-1;I.map.cre=-1}if((t.dataset.m==="deb"||t.dataset.m==="cre")&&Number(t.value)>=0)I.map.a=-1;buildRows();t.blur();render();return}
  if(t.dataset.pc){
    const r=I.rows.find(x=>x.id===t.dataset.pc);if(!r) return;
    const c=t.value||"";const key=mkey(r.m);
    for(const o of I.rows) if(!o.dup&&o.k==="spesa"&&(o.id===r.id||(mkey(o.m)===key&&(I.edits[o.rk]||{}).cb!=="manuale")))
      I.edits[o.rk]=Object.assign(I.edits[o.rk]||{},{c,cb:o.id===r.id?"manuale":"regola",f:null});
    buildRows();t.blur();render();return;
  }
  if(t.dataset.pk){
    const r=I.rows.find(x=>x.id===t.dataset.pk);if(!r) return;
    const e2=Object.assign(I.edits[r.rk]||{},{k:t.value});
    if(t.value==="spesa"){if(!r.c){const ac=autoCat({...r,k:"spesa"});if(ac){e2.c=ac.c;e2.cb=ac.by}else e2.c=""}}else{e2.c=null}
    I.edits[r.rk]=e2;buildRows();t.blur();render();return;
  }
});

(function start(){
  const cfg=window.FIREBASE_CONFIG;
  if(!cfg||!cfg.apiKey||/INSERISCI/.test(cfg.apiKey)){S.authed=false;document.querySelector("nav.tabs").style.display="none";$("#view").innerHTML=`<p class="banner" style="margin-top:24px">Manca la configurazione: compila config.js con i dati del progetto Firebase (vedi LEGGIMI.md).</p>`;return}
  const app=initializeApp(cfg);
  S.auth=getAuth(app);
  S.db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
  let unsubs=[];
  onAuthStateChanged(S.auth,u=>{
    unsubs.forEach(f=>f());unsubs=[];
    S.authed=!!u;S.uid=u?u.email:null;
    if(!u){S.months={};S.settings=clone(DEFAULTS);rebuildCats();S.imp=null;rebuild();render();return}
    const denied=err=>{if(err&&err.code==="permission-denied"){S.authMsg="Questo account non è autorizzato a usare l’app.";signOut(S.auth)}else toast("Connessione ai dati persa: ricarica la pagina.")};
    unsubs.push(onSnapshot(collection(S.db,"months"),snap=>{const m={};snap.docs.forEach(d=>{m[d.id]=d.data()});S.months=m;rebuild();if(S.imp)buildRows();render()},denied));
    unsubs.push(onSnapshot(doc(S.db,"fam","settings"),d=>{S.settings=Object.assign(clone(DEFAULTS),d.exists()?d.data():{});if(JSON.stringify(S.settings.members)===JSON.stringify(["Famiglia","Alessandro","Moglie"]))S.settings.members=DEFAULTS.members.slice();if(!S.settings.accounts)S.settings.accounts={};if(!S.settings.rules)S.settings.rules={};if(!S.settings.formats)S.settings.formats={};if(!S.settings.budgets)S.settings.budgets={};if(!S.settings.conti)S.settings.conti={};if(!S.settings.acctok)S.settings.acctok={};if(!S.settings.cats)S.settings.cats={};rebuildCats();render()},denied));
    render();
  });
})();
})();
